<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Input Kajian</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 pb-24">

<header
class="sticky top-0 bg-emerald-600 text-white shadow z-50">

<div class="max-w-4xl mx-auto p-4">

<h1 class="text-2xl font-bold">

➕ Input Kajian Baru

</h1>

<p class="text-white/90">

Tempel pesan WhatsApp lalu analisa otomatis

</p>

</div>

</header>

<main
class="max-w-4xl mx-auto p-4 space-y-4">

<!-- PESAN WA -->

<div
class="bg-white rounded-xl shadow p-4">

<h2
class="font-bold mb-3">

📱 Pesan WhatsApp

</h2>

<textarea
id="waText"
rows="10"
class="
w-full
border
rounded-xl
p-3
outline-none"
placeholder="Paste pesan WA disini...">
</textarea>

<button
onclick="analisaWA()"
class="
mt-3
bg-emerald-600
text-white
px-4
py-2
rounded-lg">

🔍 Analisa

</button>

</div>

<!-- DATA MASJID -->

<div
class="bg-white rounded-xl shadow p-4">

<h2
class="font-bold mb-3">

🕌 Data Masjid

</h2>

<div class="grid md:grid-cols-2 gap-3">

<div>

<label>Masjid ID</label>

<input
id="masjidId"
class="w-full border rounded p-2">

</div>

<div>

<label>Nama Masjid</label>

<input
id="namaMasjid"
class="w-full border rounded p-2">

</div>

<div>

<label>Kecamatan</label>

<input
id="kecamatan"
class="w-full border rounded p-2">

</div>

<div>

<label>HP Masjid</label>

<input
id="hpMasjid"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Alamat</label>

<input
id="alamat"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Maps</label>

<input
id="maps"
class="w-full border rounded p-2">

</div>

</div>

</div>

<!-- DATA KAJIAN -->

<div
class="bg-white rounded-xl shadow p-4">

<h2
class="font-bold mb-3">

📚 Data Kajian

</h2>

<div class="grid md:grid-cols-2 gap-3">

<div>

<label>Hari</label>

<input
id="hari"
class="w-full border rounded p-2">

</div>

<div>

<label>Waktu</label>

<input
id="waktu"
class="w-full border rounded p-2">

</div>

<div>

<label>Pemateri</label>

<input
id="pemateri"
class="w-full border rounded p-2">

</div>

<div>

<label>HP Panitia</label>

<input
id="hpPanitia"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Materi</label>

<input
id="materi"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Keterangan</label>

<input
id="keterangan"
class="w-full border rounded p-2">

</div>

</div>

<div class="mt-4 flex gap-4">

<label>

<input
type="checkbox"
id="isKitab">

 Kajian Kitab

</label>

<label>

<input
type="checkbox"
id="isMuslimah">

 Muslimah

</label>

<label>

<input
type="checkbox"
id="isAnak">

 Anak

</label>

<label>

<input
type="checkbox"
id="aktif"
checked>

 Aktif

</label>

</div>

</div>

<button
onclick="simpanKajian()"
class="
w-full
bg-emerald-600
text-white
py-3
rounded-xl
font-bold">

💾 SIMPAN KAJIAN

</button>

</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec';
let masjidList = [];

async function loadMasjid(){

try{

const res =
await fetch(
`${API_URL}?mode=home`
);

const data =
await res.json();

console.log(data);

masjidList =
data.masjid || [];
 
console.log(
masjidList[0]
);
 
console.log(
"Jumlah Masjid:",
masjidList.length
);

}
catch(err){

console.error(err);

alert(
"Gagal memuat data masjid\n" +
err.message
);

}

}
 
 
function analisaWA(){

const text =
document
.getElementById(
"waText"
)
.value;

if(!text){

alert(
"Paste pesan WA terlebih dahulu"
);

return;

}

deteksiMasjid(text);

deteksiHari(text);

deteksiWaktu(text);

deteksiPemateri(text);

deteksiMateri(text);

deteksiKategori(text);

}
function deteksiMasjid(text){

const lower =
text.toLowerCase();

let terbaik = null;
let skorTerbaik = 0;

masjidList.forEach(m => {

const nama =
(m.nama || "")
.toLowerCase();

const kata =
nama.split(/\s+/);

let skor = 0;

kata.forEach(k => {

if(
k.length > 2 &&
lower.includes(k)
){
skor++;
}

});

if(skor > skorTerbaik){

skorTerbaik = skor;
terbaik = m;

}

});

if(!terbaik || skorTerbaik < 2)
return;

document.getElementById("masjidId").value =
terbaik.id;

document.getElementById("namaMasjid").value =
terbaik.nama;

document.getElementById("kecamatan").value =
terbaik.kecamatan;

document.getElementById("alamat").value =
terbaik.alamat;

document.getElementById("hpMasjid").value =
terbaik.hp || "";

document.getElementById("maps").value =
terbaik.maps || "";

}

function deteksiHari(text){

const hariList = [

"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu",
"Ahad",
"Minggu"

];

const found =
hariList.find(h =>

text
.toLowerCase()
.includes(
h.toLowerCase()
)

);

if(found){

document
.getElementById(
"hari"
)
.value =
found;

}

}

function deteksiWaktu(text){

const pola = [

"Ba'da Subuh",
"Ba'da Dzuhur",
"Ba'da Ashar",
"Ba'da Maghrib",
"Ba'da Isya"

];

const found =
pola.find(p =>

text
.toLowerCase()
.includes(
p.toLowerCase()
)

);

if(found){

document
.getElementById(
"waktu"
)
.value =
found;

}

}

function deteksiPemateri(text){

const lines =
text.split("\n");

for(
let line of lines
){

if(

line.includes("Ustadz") ||

line.includes("Ust.") ||

line.includes("Syaikh")

){

document
.getElementById(
"pemateri"
)
.value =
line.trim();

break;

}

}

}

function deteksiMateri(text){

const lines =
text.split("\n");

for(
let line of lines
){

if(

line.includes("Kitab") ||

line.includes("Syarah") ||

line.includes("Tematik")

){

document
.getElementById(
"materi"
)
.value =
line.trim();

break;

}

}

}

function deteksiKategori(text){

const lower =
text.toLowerCase();

document
.getElementById(
"isMuslimah"
)
.checked =
lower.includes(
"muslimah"
);

document
.getElementById(
"isAnak"
)
.checked =
lower.includes(
"anak"
);

document
.getElementById(
"isKitab"
)
.checked =

lower.includes(
"kitab"
)

||

lower.includes(
"syarah"
);

}

async function simpanKajian(){

const yakin =
confirm(
"Yakin ingin menyimpan kajian ini?"
);

if(!yakin)
return;

const payload = {

action:
"simpanKajian",

masjidId:
document.getElementById("masjidId").value,

hari:
document.getElementById("hari").value,

waktu:
document.getElementById("waktu").value,

pemateri:
document.getElementById("pemateri").value,

materi:
document.getElementById("materi").value,

keterangan:
document.getElementById("keterangan").value,

hpPanitia:
document.getElementById("hpPanitia").value,

isKitab:
document.getElementById("isKitab").checked,

isMuslimah:
document.getElementById("isMuslimah").checked,

isAnak:
document.getElementById("isAnak").checked

};

try{
const params =
new URLSearchParams({

mode:
"simpanKajian",

masjidId:
payload.masjidId,

hari:
payload.hari,

waktu:
payload.waktu,

pemateri:
payload.pemateri,

materi:
payload.materi,

keterangan:
payload.keterangan,

hpPanitia:
payload.hpPanitia,

isKitab:
payload.isKitab,

isMuslimah:
payload.isMuslimah,

isAnak:
payload.isAnak

});

const res =
await fetch(
`${API_URL}?${params}`
);

const result =
await res.json();

if(result.success){

alert(
"Berhasil disimpan.\nJadwal ID: " +
result.jadwalId
);

}
else{

alert(
"Gagal menyimpan"
);

}

}
catch(err){

console.error(err);

alert(
err.message
);

}

}

window.onload = () => {
  loadMasjid();
};
</script>

</body>
</html>
