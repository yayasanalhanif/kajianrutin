<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Input Kajian</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 pb-24">

<header
class="sticky top-0 bg-emerald-600 text-white shadow z-50">

➕ Input Kajian Baru

</h1>

<p class="text-white/90">

Tempel pesan WhatsApp lalu analisa otomatis

</p>

</div>

</header>

<main
class="max-w-4xl mx-auto p-4 space-y-4">

<!-- PESAN WA -->

class="bg-white rounded-xl shadow p-4">

<h2
class="font-bold mb-3">

📱 Pesan WhatsApp

</h2>

<textarea
id="waText"
rows="10"
class="
w-full
border
rounded-xl
p-3
outline-none"
placeholder="Paste pesan WA disini...">
</textarea>

<button
onclick="analisaWA()"
class="
mt-3
bg-emerald-600
text-white
px-4
py-2
rounded-lg">

🔍 Analisa

</button>
<hr class="my-8">

<h2 class="text-xl font-bold mb-3">

📥 Input Massal dari WhatsApp

</h2>

<textarea
id="batchInput"
rows="12"
class="
w-full
border
rounded-xl
p-3
font-mono
text-sm
"
placeholder="Paste pesan WA di sini...">
</textarea>

<button
onclick="analisaBatch()"
class="
mt-3
bg-emerald-600
text-white
px-4
py-2
rounded-lg
">

🔍 Analisa Batch

</button>
</div>

<!-- DATA MASJID -->

<div
class="bg-white rounded-xl shadow p-4">

<h2
class="font-bold mb-3">

🕌 Data Masjid

</h2>

<div class="grid md:grid-cols-2 gap-3">

<div>

<label>Masjid ID</label>

<input
id="masjidId"
class="w-full border rounded p-2">

</div>

<div>

<label>Nama Masjid</label>

<input
id="namaMasjid"
class="w-full border rounded p-2">

</div>

<div>

<label>Kecamatan</label>

<input
id="kecamatan"
class="w-full border rounded p-2">

</div>

<div>

<label>HP Masjid</label>

<input
id="hpMasjid"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Alamat</label>

<input
id="alamat"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Maps</label>

<input
id="maps"
class="w-full border rounded p-2">

</div>

</div>

</div>

<!-- DATA KAJIAN -->

<div
class="bg-white rounded-xl shadow p-4">

<h2
class="font-bold mb-3">

📚 Data Kajian

</h2>

<div class="grid md:grid-cols-2 gap-3">

<div>

<label>Hari</label>

<input
id="hari"
class="w-full border rounded p-2">

</div>

<div>

<label>Waktu</label>

<input
id="waktu"
class="w-full border rounded p-2">

</div>

<div>

<label>Pemateri</label>

<input
id="pemateri"
class="w-full border rounded p-2">

</div>

<div>

<label>HP Panitia</label>

<input
id="hpPanitia"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Materi</label>

<input
id="materi"
class="w-full border rounded p-2">

</div>

<div class="md:col-span-2">

<label>Keterangan</label>

<input
id="keterangan"
class="w-full border rounded p-2">

</div>
<div
id="batchResult"
class="hidden mt-6">

<h3
class="font-bold text-lg mb-3">

Hasil Analisa

</h3>

<div class="overflow-x-auto">

<table
class="
w-full
border
text-sm
">

<thead>

<tr
class="bg-slate-100">

<th class="p-2">Hari</th>
<th class="p-2">Pekan</th>
<th class="p-2">Waktu</th>
<th class="p-2">Materi</th>
<th class="p-2">Lokasi</th>

</tr>

</thead>

<tbody
id="batchTable">

</tbody>

</table>

</div>

</div>
</div>

<div class="mt-4 flex flex-wrap gap-4">

<label>
<input
type="checkbox"
id="isKitab">
 Kajian Kitab
</label>

<label>
<input
type="checkbox"
id="aktif"
checked>
 Aktif
</label>

</div>

<div class="mt-4">

<label class="block font-medium mb-1">
Kategori Kajian
</label>

<select
id="kategori"
class="
w-full
border
rounded-lg
p-2
">

<option value="Umum">
Umum
</option>

<option value="Khusus Muslimah">
Khusus Muslimah
</option>

<option value="Khusus Ikhwan">
Khusus Ikhwan
</option>

<option value="Anak">
Anak
</option>

</select>

</div>

</div>

<button
onclick="simpanKajian()"
class="
w-full
bg-emerald-600
text-white
py-3
rounded-xl
font-bold">

💾 SIMPAN KAJIAN

</button>

</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec';
let masjidList = [];

async function loadMasjid(){

try{

const res =
await fetch(
`${API_URL}?mode=home`
);

const data =
await res.json();

console.log(data);

masjidList =
data.masjid || [];
 
console.log(
masjidList[0]
);
 
console.log(
"Jumlah Masjid:",
masjidList.length
);

}
catch(err){

console.error(err);

alert(
"Gagal memuat data masjid\n" +
err.message
);

}

}
 
 
function analisaWA(){

const text =
document
.getElementById(
"waText"
)
.value;

if(!text){

alert(
"Paste pesan WA terlebih dahulu"
);

return;

}

deteksiMasjid(text);

deteksiHari(text);

deteksiWaktu(text);

deteksiPemateri(text);

deteksiMateri(text);

deteksiKategori(text);

}
function analisaBatch(){

const text =
document
.getElementById(
"batchInput"
)
.value;

const hasil =
parseBatchWA(text);

renderBatchTable(
hasil
);

}

function parseBatchWA(text){

const hasil = [];

const lines =
text
.split("\n")
.map(x => x.trim())
.filter(x => x);

let hari = "";
let waktu = "";
let pemateri = "";
let kategori = "Umum";

for(
let i=0;
i<lines.length;
i++
){

const line =
lines[i];

if(
line.startsWith(
"Pemateri:"
)
){

pemateri =
line.replace(
"Pemateri:",
""
).trim();

continue;

}

if(
line.toLowerCase()
.includes(
"muslimah"
)
){

kategori =
"Khusus Muslimah";

}

if(
line.toLowerCase()
.includes(
"ikhwan"
)
){

kategori =
"Khusus Ikhwan";

}

if(
[
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu",
"Ahad"
].some(h =>
line.includes(h)
)
){

hari =
line
.replace(/\*/g,"");

const matchWaktu =
hari.match(
/(\d{2}\.\d{2}\s*-\s*\d{2}\.\d{2})/
);

if(
matchWaktu
){

waktu =
matchWaktu[1];

hari =
hari
.split(",")[0]
.trim();

}

continue;

}

const match =
line.match(
/Pekan\s*(\d+)\s*:\s*(.+?)\s*\|\s*(.+)/i
);

if(match){

let lokasi =
match[3].trim();

let waktuBaris =
waktu;

const waktuMatch =
lokasi.match(
/(\d{2}\.\d{2}\s*-\s*\d{2}\.\d{2})/
);

if(
waktuMatch
){

waktuBaris =
waktuMatch[1];

lokasi =
lokasi
.replace(
waktuMatch[1],
""
)
.replace(/\|/g,"")
.trim();

}

hasil.push({

hari,

pekan:
match[1],

waktu:
waktuBaris,

pemateri,

materi:
match[2].trim(),

lokasi,

kategori

});

}

}

return hasil;

}

function renderBatchTable(data){

const tbody =
document.getElementById(
"batchTable"
);

tbody.innerHTML = "";

data.forEach(j => {

tbody.innerHTML += `

<tr>

<td class="border p-2">
${j.hari}
</td>

<td class="border p-2">
${j.pekan}
</td>

<td class="border p-2">
${j.waktu}
</td>

<td class="border p-2">
${j.materi}
</td>

<td class="border p-2">
${j.lokasi}
</td>

</tr>

`;

});

document
.getElementById(
"batchResult"
)
.classList.remove(
"hidden"
);

}

function deteksiMasjid(text){

const lower =
text.toLowerCase();

let terbaik = null;
let skorTerbaik = 0;

masjidList.forEach(m => {

const nama =
(m.nama || "")
.toLowerCase();

const kata =
nama.split(/\s+/);

let skor = 0;

kata.forEach(k => {

if(
k.length > 2 &&
lower.includes(k)
){
skor++;
}

});

if(skor > skorTerbaik){

skorTerbaik = skor;
terbaik = m;

}

});

if(!terbaik || skorTerbaik < 2)
return;

document.getElementById("masjidId").value =
terbaik.id;

document.getElementById("namaMasjid").value =
terbaik.nama;

document.getElementById("kecamatan").value =
terbaik.kecamatan;

document.getElementById("alamat").value =
terbaik.alamat;

document.getElementById("hpMasjid").value =
terbaik.hp || "";

document.getElementById("maps").value =
terbaik.maps || "";

}

function deteksiHari(text){

const hariList = [

"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu",
"Ahad",
"Minggu"

];

const found =
hariList.find(h =>

text
.toLowerCase()
.includes(
h.toLowerCase()
)

);

if(found){

document
.getElementById(
"hari"
)
.value =
found;

}

}

function deteksiWaktu(text){

const pola = [

"Ba'da Subuh",
"Ba'da Dzuhur",
"Ba'da Ashar",
"Ba'da Maghrib",
"Ba'da Isya"

];

const found =
pola.find(p =>

text
.toLowerCase()
.includes(
p.toLowerCase()
)

);

if(found){

document
.getElementById(
"waktu"
)
.value =
found;

}

}

function deteksiPemateri(text){

const lines =
text.split("\n");

for(
let line of lines
){

if(

line.includes("Ustadz") ||

line.includes("Ust.") ||

line.includes("Syaikh")

){

document
.getElementById(
"pemateri"
)
.value =
line.trim();

break;

}

}

}

function deteksiMateri(text){

const lines =
text.split("\n");

for(
let line of lines
){

if(

line.includes("Kitab") ||

line.includes("Syarah") ||

line.includes("Tematik")

){

document
.getElementById(
"materi"
)
.value =
line.trim();

break;

}

}

}

function deteksiKategori(text){

const lower =
text.toLowerCase();

const muslimah =
lower.includes(
"muslimah"
);

const anak =
lower.includes(
"anak"
);

const ikhwan =
lower.includes(
"ikhwan"
);

document
.getElementById(
"kategori"
)
.value =
'Khusus Muslimah';

document
.getElementById(
"isAnak"
)
.checked =
anak;

document
.getElementById(
"isIkhwan"
)
.checked =
ikhwan;

document
.getElementById(
"isKitab"
)
.checked =

lower.includes(
"kitab"
)

||

lower.includes(
"syarah"
);

document
.getElementById(
"isUmum"
)
.checked =

!(
muslimah ||
anak ||
ikhwan
);

}


async function simpanKajian(){

const yakin =
confirm(
"Yakin ingin menyimpan kajian ini?"
);

if(!yakin)
return;

const payload = {

masjidId:
document.getElementById(
"masjidId"
).value,

hari:
document.getElementById(
"hari"
).value,

pekan:
document.getElementById(
"pekan"
)?.value || "",

waktu:
document.getElementById(
"waktu"
).value,

pemateri:
document.getElementById(
"pemateri"
).value,

materi:
document.getElementById(
"materi"
).value,

keterangan:
document.getElementById(
"kategori"
).value,

hpPanitia:
document.getElementById(
"hpPanitia"
).value,

isKitab:
document.getElementById(
"isKitab"
).checked,

aktif:
document.getElementById(
"aktif"
).checked

};

try{
console.log(payload);
const params =
new URLSearchParams({

mode:
"simpanKajian",

masjidId:
payload.masjidId,

hari:
payload.hari,

pekan:
payload.pekan,

waktu:
payload.waktu,

pemateri:
payload.pemateri,

materi:
payload.materi,

keterangan:
payload.keterangan,

hpPanitia:
payload.hpPanitia,

isKitab:
payload.isKitab,

aktif:
payload.aktif

});

const res =
await fetch(
`${API_URL}?${params}`
);

const result =
await res.json();

if(result.success){

alert(
"Berhasil disimpan.\nJadwal ID: " +
result.jadwalId
);

}
else{

alert(
"Gagal menyimpan"
);

}

}
catch(err){

console.error(err);

alert(
"ERROR:\n" +
err.message
);

}

}


window.onload = () => {
  loadMasjid();
};
</script>

</body>
</html>
