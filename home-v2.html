<script>

// =====================
// URL  GAS
// =====================

const API_URL = 'https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec';

// =====================

let homeData = {};
let activeFilter = "";

function setFilter(type){

if(
activeFilter === type
){

activeFilter = "";

}
else{

activeFilter = type;

}

currentPage = 1;

const title =
document.getElementById(
'filterTitle'
);

if(!activeFilter){

title?.classList.add(
'hidden'
);

}
else{

title?.classList.remove(
'hidden'
);

title.innerHTML =

activeFilter === "kitab"
? "📚 Menampilkan Masjid dengan Kajian Kitab"

: activeFilter === "muslimah"
? "🌹 Menampilkan Masjid dengan Kajian Muslimah"

: "👶 Menampilkan Masjid dengan Kajian Anak";

}

renderMasjid();

}

    
async function loadData(){

try{

const res =
await fetch(
`${API_URL}?mode=home`
);

homeData =
await res.json();
if(
homeData.maintenanceMinor
){

const banner =
document.getElementById(
"maintenanceBanner"
);

banner.innerHTML =
`⚠️ ${
homeData.maintenanceMessage
|| "Portal sedang dalam perbaikan."
}`;

banner.classList.remove(
"hidden"
);
}
if(
homeData.maintenance
){

document.body.innerHTML = `
<div class="
min-h-screen
bg-emerald-600
text-white
flex
items-center
justify-center
p-6
">

<div class="text-center">

<h1 class="text-3xl font-bold mb-4">

🔧 Sedang Dalam Perbaikan

</h1>

<p>

Portal Kajian sedang diperbarui.
Silakan kembali beberapa saat lagi.

</p>

</div>

</div>
`;

return;

}
const ver =
document.getElementById(
'loadingVersion'
);

if(
ver &&
homeData.statistik
){

ver.innerHTML =
homeData.versi ||
"Live Database";

}
render();
const splash =
document.getElementById(
'loadingStatus'
);

if(splash){

splash.style.opacity =
'0';

setTimeout(() => {

splash.style.display =
'none';

},500);

}
}
catch(err){

console.error(err);

showToast(
"ERROR:\n" +
err.message
);

const spinner =
document.getElementById(
'loadingSpinner'
);

const text =
document.getElementById(
'loadingText'
);

if(spinner){

spinner.innerHTML =
'⚠️';

}

if(text){

text.innerHTML =
'Gagal Memuat Data';

}

}



document
.getElementById('app')
.classList.remove('hidden');

}

function render(){
const s =
homeData.statistik;

document.getElementById(
'totalKajian'
).textContent = s.kajian;

document.getElementById(
'totalKitab'
).textContent = s.kitab;

document.getElementById(
'totalMuslimah'
).textContent = s.muslimah;

document.getElementById(
'totalAnak'
).textContent = s.anak;

document.getElementById(
'masjidTeraktif'
).textContent =
s.masjidTeraktif ||
homeData.rankingMasjid[0]?.nama ||
'-';

document.getElementById(
'kajianTerbanyak'
).textContent =
`${s.kajianTerbanyak ||
homeData.rankingMasjid[0]?.kajian ||
0} Kajian`;

renderKecamatan();

renderMasjid();
}

function renderKecamatan(){

const ranking =
document.getElementById(
'rankingKecamatan'
);

ranking.innerHTML='';

homeData.rankingKecamatan
.forEach(item=>{

ranking.innerHTML += `
<div class="flex justify-between">
<span>${item.kecamatan}</span>
<span class="font-semibold">
${item.kajian}
</span>
</div>
`;

});

const select =
document.getElementById(
'filterKecamatan'
);

const unik =
[
...new Set(
homeData.masjid.map(
m=>m.kecamatan
)
)
];

unik.sort();

unik.forEach(k=>{

select.innerHTML += `
<option value="${k}">
${k}
</option>
`;

});

select.addEventListener(
'change',
renderMasjid
);

}
let currentPage = 1;
const perPage = 4;
function highlight(text, keyword){

if(!keyword)
return text;

const regex =
new RegExp(
`(${keyword})`,
"gi"
);

return text.replace(

regex,

`<mark class="
bg-yellow-200
px-1
rounded
">$1</mark>`

);

}
    
function renderSearchResult(keyword){

const container =
document.getElementById(
"searchResultContainer"
);

container.innerHTML = "";

if(!keyword){

container.classList.add(
"hidden"
);

return;

}

const hasil =
homeData.jadwal.filter(j => {

const text = (

(j.pemateri || "") +
" " +
(j.materi || "") +
" " +
(j.namaMasjid || "") +
" " +
(j.kecamatan || "") +
" " +
(j.hari || "") +
" " +
(j.waktu || "") +
" " +
(j.keterangan || "")

).toLowerCase();

return text.includes(
keyword.toLowerCase()
);

});

container.classList.remove(
"hidden"
);

if(hasil.length === 0){
// info.innerHTML = `🔍 Ditemukan ${hasil.length} kajian`;
container.innerHTML = `

<div class="bg-white rounded-xl p-4 shadow text-center">

Tidak ditemukan hasil pencarian.

</div>

`;

return;

}

hasil.forEach(j => {

let badge = "";

if(j.isKitab){

badge += `
<span class="
inline-block
px-2 py-1
rounded-full
bg-blue-100
text-blue-700
text-xs
font-semibold
mr-1">
📖 KITAB
</span>`;
}

if(j.isMuslimah){

badge += `
<span class="
inline-block
px-2 py-1
rounded-full
bg-pink-100
text-pink-700
text-xs
font-semibold
mr-1">
🌹 MUSLIMAH
</span>`;
}
else if(j.isAnak){

badge += `
<span class="
inline-block
px-2 py-1
rounded-full
bg-orange-100
text-orange-700
text-xs
font-semibold
mr-1">
👶 ANAK
</span>`;
}

container.innerHTML += `

<div class="
bg-white
rounded-xl
shadow
p-4
border
border-slate-200
">

<div class="font-semibold text-[#14532D]">

🎤 ${highlight(
j.pemateri,
keyword
)}

</div>

<div class="mt-2">

📖 ${highlight(
j.materi,
keyword
)}

</div>

<div class="mt-2 text-sm text-gray-600">

🕌 ${highlight(
j.namaMasjid,
keyword
)}

</div>

<div class="text-sm text-gray-600">

📍 ${j.kecamatan}

</div>

<div class="text-sm text-gray-600">

🕓 ${j.hari} • ${j.waktu}
${j.pekan
 ? `<div class="text-xs text-amber-600">
      Pekan ${j.pekan}
    </div>`
 : ""
}
</div>

<div class="mt-3">

${badge}

</div>

<a
href="masjid.html?id=${j.masjidId}"
class="
inline-block
mt-3
text-[#14532D]
font-semibold
">

Lihat Detail Masjid →

</a>

</div>

`;

});

}
    
function renderMasjid(){
const filter =
document.getElementById(
'filterKecamatan'
).value;
const searchInput =
document.getElementById(
'searchBox'
);

let searchValue = "";

if(searchInput){

searchValue =
searchInput.value
.toLowerCase()
.trim();

}

let data = [...homeData.masjid];

if(
activeFilter ===
"kitab"
){

data =
data.filter(
m => m.kitab > 0
);

}

if(
activeFilter ===
"muslimah"
){

data =
data.filter(
m => m.muslimah > 0
);

}

if(
activeFilter ===
"anak"
){

data =
data.filter(
m => m.anak > 0
);

}
if(filter){

data =
data.filter(
m => m.kecamatan === filter
);

}
if(searchValue){

renderSearchResult(
searchValue
);

document
.getElementById(
"masjidContainer"
)
.classList.add(
"hidden"
);
document
.getElementById(
'pagination'
)
.innerHTML = '';
return;

}

document
.getElementById(
"masjidContainer"
)
.classList.remove(
"hidden"
);
    
const container =
document.getElementById(
'masjidContainer'
);

container.innerHTML='';
const totalPages =
Math.ceil(
data.length / perPage
);

const start =
(currentPage - 1) * perPage;

const end =
start + perPage;

data =
data.slice(
start,
end
);
data.forEach(m=>{
let rankIcon = "🏅";

const index =
homeData.masjid.findIndex(
x => x.id === m.id
);

if(index === 0){
rankIcon = "🥇";
}
else if(index === 1){
rankIcon = "🥈";
}
else if(index === 2){
rankIcon = "🥉";
}
container.innerHTML += `
<div class="
card
bg-white
rounded-xl
shadow
border
border-slate-200
p-4
">
${m.foto ? `

<img
src="${m.foto}"
class="
w-full
h-40
object-cover
rounded-lg
mb-3
">

` : ""}
<h3
class="
font-bold
text-lg
text-[#14532D]
">

${rankIcon}
${m.nama}

</h3>

<div class="mt-2">

<span
class="
inline-block
bg-slate-100
text-slate-700
px-3
py-1
rounded-full
text-xs
font-medium
">

📍 ${m.kecamatan}

</span>

</div>

<div class="mt-3 flex gap-4 text-sm">

<span>
📚 ${m.kajian}
</span>

<span>
📖 ${m.kitab}
</span>

<span>
🌹 ${m.muslimah}
</span>

<span>
👶 ${m.anak}
</span>

</div>

<a
href="masjid.html?id=${m.id}"
class="
block
mt-4
text-center
bg-[#14532D]
text-white
rounded-lg
py-2
font-medium
">

Lihat Jadwal

</a>

</div>
`;

});

renderPagination(totalPages);

}
                        
function renderPagination(totalPages){

const container =
document.getElementById(
'pagination'
);

container.innerHTML = '';

if(totalPages <= 1) return;

for(
let i = 1;
i <= totalPages;
i++
){

const btn =
document.createElement('button');

btn.textContent = i;

btn.className =
i === currentPage
? 'px-3 py-1 rounded bg-emerald-600 text-white'
: 'px-3 py-1 rounded bg-white border';

btn.onclick = () => {

currentPage = i;

renderMasjid();

};

container.appendChild(btn);

}

}

    document
.addEventListener(
"input",
function(e){

if(
e.target.id !==
"searchBox"
) return;

const keyword =
e.target.value
.toLowerCase()
.trim();

const hasil =
homeData.masjid.filter(m=>{

const text = (

(m.nama || "") +
" " +
(m.kecamatan || "") +
" " +
(m.searchText || "")

).toLowerCase();

return text.includes(
keyword
);

});

renderMasjid(
hasil
);

}
);
async function shareHome(){
if(
homeData &&
homeData.maintenanceMinor
){

showToast(
homeData.maintenanceMessage
);
const namaUser =
getNamaUser();

if(!namaUser){
return;
}
return;

}
const namaUser =
getNamaUser();

if(!namaUser){
  return;
}    
try{
console.log(
"Nama User:",
namaUser
);
const res =
await fetch(
`${API_URL}?mode=share&user=${encodeURIComponent(namaUser)}`
);

const data =
await res.json();
console.log(data);

} 
loadData();
function toggleSearch(){

const box =
document.getElementById(
"searchWrapper"
);

box.classList.toggle(
"hidden"
);

if(
!box.classList.contains(
"hidden"
)
){

document
.getElementById(
"searchBox"
)
.focus();

}

}    

    function showToast(
message,
duration = 3000
){

const toast =
document.getElementById(
"toast"
);

toast.textContent =
message;

toast.classList.remove(
"hidden"
);

setTimeout(() => {

toast.classList.add(
"hidden"
);

}, duration);

}
</script>

<script>

let deferredPrompt = null;

window.addEventListener(
'beforeinstallprompt',
(e) => {

e.preventDefault();

deferredPrompt = e;

document
.getElementById(
'installBtn'
)
.classList.remove(
'hidden'
);

});

async function installApp(){

if(!deferredPrompt){

showToast(
"Aplikasi sudah terinstal atau belum didukung browser."
);

return;

}

deferredPrompt.prompt();

const result =
await deferredPrompt.userChoice;

if(
result.outcome ===
'accepted'
){

console.log(
'PWA installed'
);

}

deferredPrompt =
null;

document
.getElementById(
'installBtn'
)
.classList.add(
'hidden'
);

}


async function salinJadwalLengkap(){

try{

const namaUser =
getNamaUser();

if(!namaUser){
return;
}

const res =
await fetch(
`${API_URL}?mode=share&user=${encodeURIComponent(namaUser)}`
);

const data =
await res.json();

await navigator.clipboard.writeText(
data.shareText
);

showToast(

    function getNamaUser(){

localStorage.getItem(
"namaUserKajian"
);

if(
!namaUser
){

namaUser =
prompt(
"Masukkan nama Anda:"
);

!namaUser ||
!namaUser.trim()
){

}

"namaUserKajian",
namaUser.trim()
);

}
