<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Masjid</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    padding-bottom:80px;
}
</style>

</head>

<body class="bg-slate-100">

<header class="sticky top-0 z-50 bg-emerald-600 text-white shadow">

<div class="max-w-5xl mx-auto p-4">

<a href="home-v2.html"
class="text-sm opacity-90">

← Kembali

</a>

<h1
id="namaMasjid"
class="text-xl font-bold mt-2">

Memuat...

</h1>

</div>

</header>

<main class="max-w-5xl mx-auto p-4">

<div id="loading"
class="text-center py-10">

⏳ Memuat data...

</div>

<div id="app"
class="hidden">

<!-- INFO MASJID -->

<div class="bg-white rounded-xl shadow p-4">

<p
id="alamatMasjid"
class="text-gray-600">
-
</p>

<p
id="hpMasjid"
class="mt-2">
-
</p>

<a
id="mapsMasjid"
target="_blank"
class="inline-block mt-3 text-emerald-600 font-semibold">

Buka Google Maps

</a>

</div>

<!-- STATISTIK -->

<div
class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">

<div class="bg-white rounded-xl p-4 shadow">

<div
id="totalKajian"
class="text-2xl font-bold text-emerald-600">

0

</div>

<div class="text-sm text-gray-500">

Kajian

</div>

</div>

<div class="bg-white rounded-xl p-4 shadow">

<div
id="totalKitab"
class="text-2xl font-bold text-blue-600">

0

</div>

<div class="text-sm text-gray-500">

Kitab

</div>

</div>

<div class="bg-white rounded-xl p-4 shadow">

<div
id="totalMuslimah"
class="text-2xl font-bold text-pink-600">

0

</div>

<div class="text-sm text-gray-500">

Muslimah

</div>

</div>

<div class="bg-white rounded-xl p-4 shadow">

<div
id="totalAnak"
class="text-2xl font-bold text-orange-500">

0

</div>

<div class="text-sm text-gray-500">

Anak

</div>

</div>

</div>

<!-- DAFTAR KAJIAN -->

<div class="mt-5">

<h2 class="font-bold text-lg mb-3">

📚 Jadwal Kajian

</h2>

<div
id="jadwalContainer"
class="space-y-3">

</div>

</div>

</div>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec";

const params =
new URLSearchParams(
window.location.search
);

const masjidId =
params.get("id");

async function loadData(){

try{

const res =
await fetch(
`${API_URL}?mode=masjid&id=${masjidId}`
);

const data =
await res.json();

render(data);

}
catch(err){

  console.error(err);

  alert(
    "ERROR:\n" + err.message
  );

}

document
.getElementById("loading")
.style.display =
"none";

document
.getElementById("app")
.classList.remove(
"hidden"
);

}

function render(data){

const m =
data.masjid;

document
.getElementById(
"namaMasjid"
).textContent =
m.nama;

document
.getElementById(
"alamatMasjid"
).textContent =
"📍 " + m.alamat;

document
.getElementById(
"hpMasjid"
).textContent =
m.hp
? "📞 " + m.hp
: "";

document
.getElementById(
"mapsMasjid"
).href =
m.maps || "#";

document
.getElementById(
"totalKajian"
).textContent =
data.statistik.kajian;

document
.getElementById(
"totalKitab"
).textContent =
data.statistik.kitab;

document
.getElementById(
"totalMuslimah"
).textContent =
data.statistik.muslimah;

document
.getElementById(
"totalAnak"
).textContent =
data.statistik.anak;

renderJadwal(
data.jadwal
);

}

function renderJadwal(
jadwal
){

const container =
document.getElementById(
"jadwalContainer"
);

container.innerHTML = "";

jadwal.forEach(j=>{

let badge = "";

const ket =
(j.keterangan || "")
.toLowerCase();

if(
ket.includes(
"muslimah"
)
){
badge =
"🌹";
}
else if(
ket.includes(
"anak"
)
){
badge =
"👶";
}

container.innerHTML += `

<div class="bg-white rounded-xl shadow p-4">

<div class="font-bold">

${j.hari}
•
${j.waktu}

</div>

<div class="mt-2">

🎤 ${j.pemateri}

</div>

<div class="mt-1">

📖 ${j.materi}

</div>

<div class="text-sm text-gray-500 mt-2">

${badge}
${j.keterangan || ""}

</div>

</div>

`;

});

}

loadData();

</script>

</body>
</html>
