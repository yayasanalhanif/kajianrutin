<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Masjid</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
    padding-bottom:80px;
}
</style>
</head>
<body class="bg-slate-100">
<header class="sticky top-0 z-50 bg-[#14532D] text-white shadow-lg">
<div class="max-w-5xl mx-auto p-4">
<a href="home-v2.html"
class="text-sm opacity-90">
← Kembali
</a>
<h1
id="namaMasjid"
class="text-xl font-bold mt-2">

Memuat...

</h1>

<div
id="ringkasanMasjid"
class="
text-sm
text-emerald-100
mt-1
">
</div>
</div>
</header>
<main class="max-w-5xl mx-auto p-4">
    <div
id="heroMasjid"
class="
hidden
relative
rounded-2xl
overflow-hidden
mb-4
shadow
">

<img
id="fotoMasjid"
src=""
class="
w-full
h-56
object-cover
"
/>

<div
class="
absolute
inset-0
bg-black/40
">
</div>

<div
class="
absolute
bottom-4
left-4
flex
items-center
gap-3
">

<img
id="logoMasjid"
src=""
class="
hidden
w-16
h-16
rounded-full
bg-white
object-contain
p-1
"
/>

<div>

<div
id="heroNamaMasjid"
class="
text-white
font-bold
text-xl
">
</div>

<div
id="heroInfoMasjid"
class="
text-white/90
text-sm
">
</div>

</div>

</div>

</div>
<div id="loading"
class="text-center py-10">
⏳ Memuat data...
</div>
<div id="app"
class="hidden">
<!-- INFO MASJID -->
<div class="bg-white rounded-xl shadow p-4">
<p
id="alamatMasjid"
class="text-gray-600">
-
</p>
<p
id="hpMasjid"
class="mt-2">
-
</p>
<div class="mt-3 flex gap-2 flex-wrap">
<a
id="mapsMasjid"
target="_blank"
class="bg-emerald-600 text-white px-4 py-2 rounded-lg">
🗺️ Buka Maps
</a>
<button
onclick="shareMasjid()"
class="bg-blue-600 text-white px-4 py-2 rounded-lg">
🕌 Bagikan
</button>
</div>
</div>
<!-- STATISTIK -->
<div
class="grid grid-cols-4 gap-2 mt-4">
<div class="bg-white rounded-lg shadow p-2 text-center">
<div
id="totalKajian"
class="text-lg font-bold text-[#14532D]">
0
</div>
<div class="
text-[11px]
uppercase
tracking-wider
text-gray-500
">

KAJIAN

</div>
</div>
<div class="bg-white rounded-lg shadow p-2 text-center">
<div
id="totalKitab"
class="text-lg font-bold text-blue-600">
0
</div>
<div class="
text-[11px]
uppercase
tracking-wider
text-gray-500
">

KITAB

</div>
</div>
<div class="bg-white rounded-lg shadow p-2 text-center">
<div
id="totalMuslimah"
class="text-lg font-bold text-pink-600">
0
</div>
<div class="
text-[11px]
uppercase
tracking-wider
text-gray-500
">

MUSLIMAH

</div>
</div>
<div class="bg-white rounded-lg shadow p-2 text-center">
<div
id="totalAnak"
class="text-lg font-bold text-orange-500">
0
</div>
<div class="
text-[11px]
uppercase
tracking-wider
text-gray-500
">

ANAK

</div>
</div>
</div>
<!-- DAFTAR KAJIAN -->
<div class="mt-5">
<h2 class="font-bold text-lg mb-3">
📚 Jadwal Kajian
</h2>
<div
id="jadwalContainer"
class="space-y-3">
</div>
</div>
</div>
</main>
<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec";
const params =
new URLSearchParams(
window.location.search
);
const masjidId =
params.get("id");
let masjidData = null;
async function loadData(){
try{
const res =
await fetch(
`${API_URL}?mode=masjid&id=${masjidId}`
);
const data =
await res.json();
masjidData = data;
render(data);
}
catch(err){
  console.error(err);
  alert(
    "ERROR:\n" + err.message
  );
}
document
.getElementById("loading")
.style.display =
"none";
document
.getElementById("app")
.classList.remove(
"hidden"
);
}
function render(data){
    masjidData = data;
const m =
data.masjid;
    const hero =
document.getElementById(
'heroMasjid'
);

const foto =
document.getElementById(
'fotoMasjid'
);

const logo =
document.getElementById(
'logoMasjid'
);

if(m.foto){

hero.classList.remove(
'hidden'
);

foto.src = m.foto;

document.getElementById(
'heroNamaMasjid'
).textContent =
m.nama;

document.getElementById(
'heroInfoMasjid'
).textContent =

`📚 ${data.statistik.kajian} Kajian • 📖 ${data.statistik.kitab} Kitab`;

}

if(m.logo){

logo.src = m.logo;

logo.classList.remove(
'hidden'
);

}
document
.getElementById(
"namaMasjid"
).textContent =
m.nama;
document
.getElementById(
"alamatMasjid"
).textContent =
"📍 " + m.alamat;
document
.getElementById(
"hpMasjid"
).textContent =
m.hp
? "📞 " + m.hp
: "";
document
.getElementById(
"mapsMasjid"
).href =
m.maps || "#";
document
.getElementById(
"totalKajian"
).textContent =
data.statistik.kajian;
document
.getElementById(
"totalKitab"
).textContent =
data.statistik.kitab;
document
.getElementById(
"totalMuslimah"
).textContent =
data.statistik.muslimah;
document
.getElementById(
"totalAnak"
).textContent =
data.statistik.anak;
    document
.getElementById(
"ringkasanMasjid"
).textContent =

`📚 ${data.statistik.kajian} Kajian • 📖 ${data.statistik.kitab} Kitab`;
    
renderJadwal(
data.jadwal
);
}
    function renderJadwal(jadwal){
const container =
document.getElementById(
"jadwalContainer"
);
container.innerHTML = "";
const urutanHari = [
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jum'at",
"Sabtu",
"Ahad"
];
const grup = {};
jadwal.forEach(j => {
if(!grup[j.hari]){
grup[j.hari] = [];
}
grup[j.hari].push(j);
});
urutanHari.forEach(hari => {
if(!grup[hari]) return;
container.innerHTML += `
<div class="sticky top-16 z-10 mb-3">
<div
class="
bg-[#14532D]
text-white
font-bold
rounded-xl
px-4
py-3
shadow
">
📅 ${hari.toUpperCase()}
</div>
</div>
`;
grup[hari].forEach(j => {
let badges = "";
if(j.isKitab){
badges += ` <span class="
inline-block
px-2
py-1
rounded-full
bg-blue-100
text-blue-700
text-xs
font-semibold
mr-1">
📖 KITAB </span>`;
}
if(j.isMuslimah){
badges += ` <span class="
inline-block
px-2
py-1
rounded-full
bg-pink-100
text-pink-700
text-xs
font-semibold
mr-1">
🌹 MUSLIMAH </span>`;
}
else if(j.isAnak){
badges += ` <span class="
inline-block
px-2
py-1
rounded-full
bg-orange-100
text-orange-700
text-xs
font-semibold
mr-1">
👶 ANAK </span>`;
}
else{
badges += ` <span class="
inline-flex
items-center
px-3
py-1
rounded-full
bg-slate-100
text-slate-700
text-xs
font-semibold
border
border-slate-300
">
👥 UMUM
</span>`;
}
container.innerHTML += `
<div class="
bg-white
rounded-xl
shadow-sm
border
border-slate-200
p-4
mb-3
">
<div class="
font-semibold
text-slate-700
">
🕓 ${j.waktu}
${j.pekan
 ? `<div class="text-xs text-amber-600">
      Pekan ${j.pekan}
    </div>`
 : ""
}
</div>
<div class="
mt-2
font-medium
text-slate-800
">

🎤 ${j.pemateri}

</div>
<div class="
mt-2
text-slate-700
">

📖 ${j.materi}

</div>
<div class="mt-3">
${badges}
</div>
</div>
`;
});
});
}
    
function shareMasjid(){

if(!masjidData){

alert(
"Data masjid belum siap"
);

return;

}

const text =
encodeURIComponent(
masjidData.shareText
);

window.open(
`https://wa.me/?text=${text}`,
"_blank"
);

}
    
loadData();
</script>
<nav
class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50">

<div
class="grid grid-cols-3 text-center">

<a
href="home-v2.html"
class="py-3 font-medium text-[#14532D]">

🏠 Beranda

</a>

<a
href="#"
onclick="shareMasjid()"
class="py-3">

📤 Bagikan

</a>

<a
href="javascript:window.scrollTo({top:0,behavior:'smooth'})"
class="py-3">

⬆️ Atas

</a>

</div>

</nav>
</body>
</html>
