<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kajian Islam Ilmiah Kota Cilegon</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">

    <header class="bg-emerald-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-8 text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold flex justify-center items-center gap-3">
                <i class="fas fa-mosque"></i> Jadwal Kajian Islam Ilmiah
            </h1>
            <p class="text-emerald-100 text-base md:text-lg mt-2 font-medium">Kota Cilegon & Sekitarnya</p>
            <span id="versionLabel" class="inline-block bg-emerald-700 text-emerald-200 text-sm md:text-base px-4 py-1.5 rounded-full mt-4 font-mono font-bold">Memuat versi...</span>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-5xl">
        
        <div class="bg-white p-5 rounded-xl shadow-md border border-gray-100 mb-6 space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative">
                    <i class="fas fa-search absolute left-3.5 top-4 text-gray-400 text-base"></i>
                    <input type="text" id="searchInput" oninput="filterData()" placeholder="Cari pemateri atau kitab materi..." class="w-full pl-11 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-base md:text-lg">
                </div>
                <div class="relative">
                    <i class="fas fa-filter absolute left-3.5 top-4 text-gray-400 text-base"></i>
                    <select id="locationFilter" onchange="filterData()" class="w-full pl-11 pr-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-base md:text-lg bg-white appearance-none">
                        <option value="">Semua Lokasi / Masjid</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-6 pt-3 border-t border-gray-100">
                <span class="text-base md:text-lg font-bold text-gray-700"><i class="fas fa-tags text-emerald-600 mr-1"></i> Kategori:</span>
                
                <label class="inline-flex items-center cursor-pointer text-base md:text-lg font-semibold text-gray-700">
                    <input type="radio" name="categoryFilter" value="Semua" checked onchange="filterData()" class="w-5 h-5 accent-emerald-600 mr-2">
                    Semua
                </label>
                
                <label class="inline-flex items-center cursor-pointer text-base md:text-lg font-semibold text-gray-700">
                    <input type="radio" name="categoryFilter" value="Muslimah" onchange="filterData()" class="w-5 h-5 accent-emerald-600 mr-2">
                    Muslimah 🌹
                </label>
                
                <label class="inline-flex items-center cursor-pointer text-base md:text-lg font-semibold text-gray-700">
                    <input type="radio" name="categoryFilter" value="Anak" onchange="filterData()" class="w-5 h-5 accent-emerald-600 mr-2">
                    Anak-Anak 👶
                </label>
            </div>

            <div class="pt-4 border-t border-gray-100 flex">
                <a id="btnShareWA" href="#" target="_blank" class="w-full md:w-auto inline-flex items-center justify-center bg-[#25D366] hover:bg-[#128C7E] text-white font-bold text-base md:text-lg px-6 py-3 rounded-lg shadow-sm transition gap-2">
                    <i class="fab fa-whatsapp text-xl md:text-2xl"></i> Share
                </a>
            </div>
        </div>

        <div id="loadingStatus" class="text-center py-12 text-gray-500">
            <i class="fas fa-spinner fa-spin text-4xl text-emerald-600 mb-3"></i>
            <p class="text-base font-medium">Memuat data langsung dari Google Sheet...</p>
        </div>

        <div id="kajianContainer" class="space-y-8 hidden"></div>

        <div id="noResult" class="hidden text-center py-12 text-gray-400">
            <i class="fas fa-folder-open text-5xl mb-3"></i>
            <p class="text-lg font-medium">Jadwal kajian tidak ditemukan.</p>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 mt-12 py-8 text-center text-sm text-gray-500 font-medium">
        <p>© 2026 Jadwal Kajian Cilegon</p>

    </footer>

    <script>
        // ⚠️ PASTIKAN URL INI ADALAH URL WEB APP ASLI MILIK OM AMIZA ⚠️
        const API_URL = "https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec"; 
        
        let dbKajian = [];

        async function fetchKajianData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                dbKajian = result.jadwal;
                document.getElementById('versionLabel').textContent = result.versi;
                
                // MENGHUBUNGKAN TEKS BROADCAST L2 KE TOMBOL SHARE WA WEBSITE
                if (result.teks_share) {
                    document.getElementById('btnShareWA').href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(result.teks_share);
                } else {
                    document.getElementById('btnShareWA').classList.add('hidden'); // Sembunyikan jika kosong
                }
                
                initDropdown();
                document.getElementById('loadingStatus').classList.add('hidden');
                document.getElementById('kajianContainer').classList.remove('hidden');
                filterData();
            } catch (error) {
                document.getElementById('loadingStatus').innerHTML = `
                    <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-3"></i>
                    <p class="text-base text-red-600 font-bold">Gagal memuat data dari Google Sheet.</p>
                `;
                console.error("Error fetching data:", error);
            }
        }

        function initDropdown() {
            const selectFilter = document.getElementById('locationFilter');
            const lokasiUnik = [...new Set(dbKajian.map(item => item.lokasi))];
            lokasiUnik.forEach(lok => {
                if(lok) {
                    const opt = document.createElement('option');
                    opt.value = lok;
                    opt.textContent = lok;
                    selectFilter.appendChild(opt);
                }
            });
        }

        function filterData() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const filterValue = document.getElementById('locationFilter').value;
            const categoryValue = document.querySelector('input[name="categoryFilter"]:checked').value;
            
            const container = document.getElementById('kajianContainer');
            const noResult = document.getElementById('noResult');
            
            container.innerHTML = '';

            const filtered = dbKajian.filter(item => {
                const matchSearch = item.pemateri.toLowerCase().includes(searchValue) || item.materi.toLowerCase().includes(searchValue);
                const matchLocation = filterValue === "" || item.lokasi === filterValue;
                
                let matchCategory = false;
                const ketText = item.ket.toLowerCase();
                
                if (categoryValue === "Semua") {
                    matchCategory = true;
                } else if (categoryValue === "Muslimah") {
                    matchCategory = ketText.includes("muslimah");
                } else if (categoryValue === "Anak") {
                    matchCategory = ketText.includes("anak");
                }

                return matchSearch && matchLocation && matchCategory;
            });

            if (filtered.length === 0) {
                noResult.classList.remove('hidden');
                return;
            } else {
                noResult.classList.add('hidden');
            }

            const groups = filtered.reduce((acc, item) => {
                if (!acc[item.lokasi]) {
                    acc[item.lokasi] = { alamat: item.alamat, cp_masjid: item.cp_masjid, jadwal: [] };
                }
                acc[item.lokasi].jadwal.push(item);
                return acc;
            }, {});

            for (const [namaMasjid, info] of Object.entries(groups)) {
                let sectionHTML = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 mb-8">
                        <div class="bg-slate-800 text-white p-5 md:p-6">
                            <h3 class="text-lg md:text-xl font-bold flex items-center gap-2"><i class="fas fa-map-marker-alt text-emerald-400"></i> ${namaMasjid.toUpperCase()}</h3>
                            <div class="text-sm md:text-base text-gray-300 mt-2 flex flex-wrap gap-x-6 gap-y-1">
                                ${info.alamat ? `<span><i class="fas fa-location-dot fa-fw text-emerald-400"></i> ${info.alamat}</span>` : ''}
                                ${info.cp_masjid && info.cp_masjid !== '-' ? `<span><i class="fas fa-phone fa-fw text-emerald-400"></i> CP Masjid: ${info.cp_masjid}</span>` : ''}
                            </div>
                        </div>
                        <div class="divide-y divide-gray-100">
                `;

                info.jadwal.forEach(j => {
                    const ketLower = j.ket ? j.ket.toLowerCase() : "";
                    const isMuslimah = ketLower.includes("muslimah");
                    const isAnak = ketLower.includes("anak");

                    sectionHTML += `
                        <div class="p-5 md:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-gray-50/50 transition">
                            <div class="space-y-2 w-full">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="bg-emerald-100 text-emerald-800 text-sm font-bold px-2.5 py-0.5 rounded-sm">${j.hari}</span>
                                    <span class="text-sm md:text-base text-gray-500 font-semibold"><i class="far fa-clock mr-1"></i>${j.waktu}</span>
                                </div>
                                <h4 class="text-base md:text-lg font-bold text-gray-900">${j.pemateri}</h4>
                                <p class="text-sm md:text-base text-gray-600 font-medium">${j.materi}</p>
                                
                                ${j.cp_kajian && j.cp_kajian !== '-' ? `
                                <div class="text-xs md:text-sm text-emerald-600 font-bold pt-1 flex items-center gap-1.5">
                                    <i class="fas fa-phone-alt"></i> Hubungi Panitia: ${j.cp_kajian}
                                </div>` : ''}
                            </div>
                            <div class="shrink-0 flex items-center">
                                ${isMuslimah ? `<span class="inline-flex items-center text-sm md:text-base text-rose-600 bg-rose-50 px-3 py-1 rounded-full font-bold shadow-xs">Khusus Muslimah 🌹</span>` : ''}
                                ${isAnak ? `<span class="inline-flex items-center text-sm md:text-base text-amber-600 bg-amber-50 px-3 py-1 rounded-full font-bold shadow-xs">Kajian Anak 👶</span>` : ''}
                                ${j.ket && !isMuslimah && !isAnak ? `<span class="inline-flex items-center text-sm md:text-base text-blue-600 bg-blue-50 px-3 py-1 rounded-full font-bold shadow-xs">${j.ket}</span>` : ''}
                            </div>
                        </div>
                    `;
                });

                sectionHTML += `</div></div>`;
                container.innerHTML += sectionHTML;
            }
        }

        window.onload = fetchKajianData;
    </script>
</body>
</html>
