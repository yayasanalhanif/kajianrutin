<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kajian Cilegon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <main id="app" class="container mx-auto px-4 py-6 max-w-5xl"></main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const app = document.getElementById('app');
        // GANTI URL INI DENGAN URL WEB APP APPS SCRIPT OM
        const API_URL = "https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec?mode=api";

        // --- 1. ROUTING ---
        if (params.get('page') === 'input') {
            app.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-xl font-bold mb-4 text-emerald-700">Admin Input Kajian</h2>
                    <textarea id="rawText" class="w-full h-40 p-3 border rounded" placeholder="Paste teks WA di sini..."></textarea>
                    <button onclick="prosesData()" class="mt-4 bg-emerald-600 text-white px-6 py-2 rounded font-bold">Rapikan dengan AI</button>
                    <div id="formResult" class="mt-6 space-y-2 hidden">
                        <input type="text" id="lokasi" class="w-full p-2 border rounded" placeholder="Lokasi">
                        <button onclick="kirimKeSheet()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">Simpan ke Sheet</button>
                    </div>
                </div>
            `;
        } else {
            app.innerHTML = `
                <header class="text-center py-6"><h1 class="text-3xl font-extrabold text-emerald-700">Jadwal Kajian Sunnah</h1></header>
                <div id="kajianContainer" class="space-y-4"></div>
            `;
            fetchKajianData();
        }

        // --- 2. FUNGSI PUBLIK (ASLI DARI SCRIPT OM) ---
        let dbKajian = [];
        async function fetchKajianData() {
            try {
                const res = await fetch(API_URL);
                const result = await res.json();
                dbKajian = result.jadwal || [];
                const container = document.getElementById('kajianContainer');
                container.innerHTML = dbKajian.map(j => `
                    <div class="bg-white p-4 rounded shadow border-l-4 border-emerald-500">
                        <h3 class="font-bold text-lg">${j.pemateri}</h3>
                        <p class="text-sm">${j.materi} di ${j.lokasi}</p>
                    </div>
                `).join('');
            } catch(e) { app.innerHTML = "Gagal memuat jadwal."; }
        }

        // --- 3. FUNGSI ADMIN (AI & JEMBATAN) ---
        async function prosesData() {
            const teks = document.getElementById('rawText').value;
            alert("Memproses teks dengan AI...");
        }

        async function kirimKeSheet() {
            alert("Data dikirim ke Sheet!");
        }
    </script>
</body>
</html>
