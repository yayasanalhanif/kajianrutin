<script>

/* =====================================================
API
===================================================== */

/*
GANTI DENGAN API_URL YANG SAMA DENGAN home-v2.html
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec";


/* =====================================================
GLOBAL DATA
===================================================== */

let homeData = null;

let semuaKajian = [];

let semuaMasjid = [];

let currentWeekStart = null;


/* =====================================================
UTILITY
===================================================== */

function showStatus(
  text,
  type = "normal"
){

const el =
document.getElementById(
"status"
);

el.classList.remove(
"hidden"
);

el.textContent = text;

if(type === "error"){

el.className =
"bg-red-50 text-red-700 rounded-xl p-4 mb-5 shadow text-sm";

}
else if(type === "success"){

el.className =
"bg-green-50 text-green-700 rounded-xl p-4 mb-5 shadow text-sm";

}
else{

el.className =
"bg-white rounded-xl p-4 mb-5 shadow text-sm";

}

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
FORMAT TANGGAL
===================================================== */

function formatTanggal(
date
){

return date.toLocaleDateString(
"id-ID",
{
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* =====================================================
NAMA HARI
===================================================== */

const namaHari = [
"Minggu",
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu"
];


/* =====================================================
MENCARI SENIN MINGGU BERJALAN
===================================================== */

function getMonday(
date = new Date()
){

const d =
new Date(date);

const day =
d.getDay();

const diff =
day === 0
? -6
: 1 - day;

d.setDate(
d.getDate() + diff
);

d.setHours(
0,0,0,0
);

return d;

}


/* =====================================================
MEMBUAT DAFTAR MINGGU
===================================================== */

function populateWeeks(){

const select =
document.getElementById(
"weekSelect"
);

select.innerHTML = "";

const sekarang =
getMonday();

for(
let i = -4;
i <= 8;
i++
){

const start =
new Date(sekarang);

start.setDate(
start.getDate() +
(i * 7)
);

const end =
new Date(start);

end.setDate(
end.getDate() + 6
);

const option =
document.createElement(
"option"
);

option.value =
start.toISOString();

option.textContent =
`${formatTanggal(start)} – ${formatTanggal(end)}`;

if(i === 0){

option.selected = true;

}

select.appendChild(
option
);

}

currentWeekStart =
sekarang;

}


/* =====================================================
AREA
===================================================== */

function populateAreas(){

const select =
document.getElementById(
"areaSelect"
);

select.innerHTML = `
<option value="">
Semua Area
</option>
`;

const areas =
[
...new Set(
semuaKajian
.map(
j => j.kecamatan
)
.filter(
k => k &&
String(k).trim()
)
)
]
.sort(
(a,b) =>
String(a).localeCompare(
String(b)
)
);

areas.forEach(
area => {

const option =
document.createElement(
"option"
);

option.value =
area;

option.textContent =
area;

select.appendChild(
option
);

});

}


/* =====================================================
MASJID
===================================================== */

function populateMasjid(){

const select =
document.getElementById(
"masjidSelect"
);

select.innerHTML = `
<option value="">
Semua Masjid
</option>
`;

const area =
document.getElementById(
"areaSelect"
).value;


/*
Ambil daftar masjid langsung
dari data jadwal.
*/

let data =
semuaKajian;


/*
Filter berdasarkan area
jika dipilih.
*/

if(area){

data =
data.filter(
j =>
String(j.kecamatan) ===
String(area)
);

}


/*
Buat daftar unik berdasarkan masjidId.
*/

const masjidMap = new Map();

data.forEach(
j => {

const id =
j.masjidId;

if(
id === undefined ||
id === null
){

return;

}

if(
!masjidMap.has(
String(id)
)
){

masjidMap.set(
String(id),
{
id:id,
nama:
j.namaMasjid ||
j.lokasi ||
"Masjid",
kecamatan:
j.kecamatan ||
""
}
);

}

});


/*
Urutkan nama masjid.
*/

const daftarMasjid =
[
...masjidMap.values()
]
.sort(
(a,b) =>
String(a.nama)
.localeCompare(
String(b.nama)
)
);


/*
Masukkan ke SELECT.
*/

daftarMasjid.forEach(
m => {

const option =
document.createElement(
"option"
);

option.value =
m.id;

option.textContent =
m.nama;

select.appendChild(
option
);

});

}





/* =====================================================
WAKTU SORTING
===================================================== */

function timeToNumber(
waktu
){

if(!waktu){

return 9999;

}

const match =
String(waktu)
.match(
/(\d{1,2})[.:](\d{2})/
);

if(!match){

return 9999;

}

return (
Number(match[1]) * 60 +
Number(match[2])
);

}


/* =====================================================
NORMALISASI HARI
===================================================== */

function normalHari(
hari
){

if(!hari){

return "";

}

const h =
String(hari)
.trim()
.toLowerCase();

if(h === "ahad"){

return "Minggu";

}

return (
h.charAt(0).toUpperCase() +
h.slice(1)
);

}


/* =====================================================
MEMBUAT BADGE
===================================================== */

function renderBadges(
j
){

let html = "";

if(
j.isKitab === true ||
j.isKitab === "TRUE"
){

html += `
<span class="
badge
badge-kitab
">
📖 KITAB
</span>
`;

}

if(
j.isMuslimah === true ||
j.isMuslimah === "TRUE"
){

html += `
<span class="
badge
badge-muslimah
">
🌹 MUSLIMAH
</span>
`;

}

if(
j.isAnak === true ||
j.isAnak === "TRUE"
){

html += `
<span class="
badge
badge-anak
">
👶 ANAK
</span>
`;

}

if(j.pekan){

html += `
<span class="
badge
badge-pekan
">
Pekan ${escapeHtml(j.pekan)}
</span>
`;

}

return html;

}


/* =====================================================
MEMBUAT CARD KAJIAN
===================================================== */

function renderKajianCard(j){

const namaMasjid =
j.namaMasjid ||
j.lokasi ||
"Masjid";

const area =
j.kecamatan ||
"";

let badges = "";

if(
j.isKitab === true ||
j.isKitab === "TRUE"
){

badges += `
<span class="poster-card-badge poster-card-kitab">
📖 KITAB
</span>
`;

}

if(
j.isMuslimah === true ||
j.isMuslimah === "TRUE"
){

badges += `
<span class="poster-card-badge poster-card-muslimah">
🌸 MUSLIMAH
</span>
`;

}

if(
j.isAnak === true ||
j.isAnak === "TRUE"
){

badges += `
<span class="poster-card-badge poster-card-anak">
👶 ANAK
</span>
`;

}

if(j.pekan){

badges += `
<span class="poster-card-badge poster-card-pekan">
📅 PEKAN ${escapeHtml(j.pekan)}
</span>
`;

}

return `

<div class="poster-kajian">

<div class="poster-time">

${escapeHtml(
j.waktu || "--:--"
)}

</div>

<div class="poster-kajian-body">

<div class="poster-masjid">

${escapeHtml(
namaMasjid
)}

</div>

<div class="poster-area">

📍 ${escapeHtml(area)}

</div>

<div class="poster-pemateri">

${escapeHtml(
j.pemateri || "-"
)}

</div>

<div class="poster-materi">

${escapeHtml(
j.materi || "-"
)}

</div>

<div class="poster-card-badges">

${badges}

</div>

</div>

</div>

`;

}


/* =====================================================
MENGAMBIL DATA MINGGU
===================================================== */

function getKajianMinggu(){

const value =
document.getElementById(
"weekSelect"
).value;

const start =
new Date(value);

start.setHours(
0,0,0,0
);

const end =
new Date(start);

end.setDate(
end.getDate() + 6
);

return {
start,
end
};

}


/* =====================================================
FILTER DATA
===================================================== */

function getFilteredKajian(){

let data =
[...semuaKajian];

const area =
document.getElementById(
"areaSelect"
).value;

const masjidId =
document.getElementById(
"masjidSelect"
).value;

if(area){

data =
data.filter(
j =>
String(j.kecamatan) ===
String(area)
);

}

if(masjidId){

data =
data.filter(
j =>
String(j.masjidId) ===
String(masjidId)
);

}

return data;

}


/* =====================================================
RENDER POSTER
===================================================== */

function renderPoster(){

const poster =
document.getElementById(
"poster"
);

const {
start,
end
} =
getKajianMinggu();

let data =
getFilteredKajian();


/* =========================================
   GROUP HARI
========================================= */

const grouped = {};

[
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu",
"Minggu"
]
.forEach(
hari => {

grouped[hari] = [];

});


data.forEach(
j => {

const hari =
normalHari(
j.hari
);

if(
grouped[hari]
){

grouped[hari].push(j);

}

});


/* =========================================
   HEADER
========================================= */

let html = `

<div class="poster-template-header">

<div class="poster-brand">

<div class="poster-logo-mark">

JKC

</div>

<div>

<div class="poster-title-small">
Jadwal
</div>

/* =====================================================
DOWNLOAD PNG
===================================================== */

async function downloadPoster(){

const poster =
document.getElementById(
"poster"
);

if(!poster){

return;

}

showStatus(
"Sedang membuat PNG..."
);

try{

const canvas =
await html2canvas(
poster,
{
scale:2,
useCORS:true,
backgroundColor:"#ffffff"
}
);

const link =
document.createElement(
"a"
);

link.download =
"jadwal-kajian-cilegon.png";

link.href =
canvas.toDataURL(
"image/png"
);

link.click();

showStatus(
"Poster berhasil dibuat.",
"success"
);

}catch(err){

console.error(err);

showStatus(
"Gagal membuat PNG.",
"error"
);

}

}


/* =====================================================
SHARE
===================================================== */

async function sharePoster(){

const poster =
document.getElementById(
"poster"
);

try{

const canvas =
await html2canvas(
poster,
{
scale:2,
useCORS:true,
backgroundColor:"#ffffff"
}
);

canvas.toBlob(
async blob => {

if(!blob){

return;

}

const file =
new File(
[blob],
"jadwal-kajian-cilegon.png",
{
type:"image/png"
}
);

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

title:
"Jadwal Kajian Cilegon",

text:
"Jadwal Kajian Islam Ilmiah Kota Cilegon",

files:[file]

});

}
else{

downloadPoster();

}

},
"image/png"
);

}catch(err){

console.error(err);

showStatus(
"Gagal membagikan poster.",
"error"
);

}

}
