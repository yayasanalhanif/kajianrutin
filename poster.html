<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#14532D">

<title>
Generator Poster - Jadwal Kajian Cilegon
</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
  background:#f1f5f9;
}

.poster{
  width:1080px;
  min-height:1350px;
  background:#ffffff;
  overflow:hidden;
  position:relative;
}

.poster-header{
  background:#14532D;
  color:white;
}

.day-title{

  color:white;
}

.kajian-card{
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:20px;
  background:#ffffff;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  margin-right:5px;
  margin-top:5px;
}

.badge-kitab{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-muslimah{
  background:#fce7f3;
  color:#be185d;
}

.badge-anak{
  background:#fef3c7;
  color:#b45309;
}

.badge-pekan{
  background:#fef3c7;
  color:#a16207;
}

@media(max-width:1100px){

  .poster-wrapper{
    overflow-x:auto;
  }

}

</style>

</head>

<body>

<!-- =====================================================
HEADER APLIKASI
===================================================== -->

<header class="
bg-[#14532D]
text-white
p-4
sticky
top-0
z-50
shadow
">

<div class="
max-w-6xl
mx-auto
">

<h1 class="font-bold text-xl">
🎨 Generator Poster
</h1>

<p class="text-sm text-white/80">
Jadwal Kajian Islam Ilmiah Kota Cilegon
</p>

</div>

</header>


<!-- =====================================================
PANEL KONTROL
===================================================== -->

<main class="
max-w-6xl
mx-auto
p-4
">

<div class="
bg-white
rounded-2xl
shadow
p-5
mb-5
">

<h2 class="
font-bold
text-lg
mb-4
">

⚙️ Pengaturan Poster

</h2>


<!-- MINGGU -->

<div class="mb-4">

<label class="
block
text-sm
font-semibold
mb-1
">

Minggu

</label>

<select
id="weekSelect"
class="
w-full
border
rounded-xl
p-3
bg-white
">

</select>

</div>


<!-- AREA -->

<div class="mb-4">

<label class="
block
text-sm
font-semibold
mb-1
">

Area

</label>

<select
id="areaSelect"
class="
w-full
border
rounded-xl
p-3
bg-white
">

<option value="">
Semua Area
</option>

</select>

</div>


<!-- MASJID -->

<div class="mb-4">

<label class="
block
text-sm
font-semibold
mb-1
">

Masjid

</label>

<select
id="masjidSelect"
class="
w-full
border
rounded-xl
p-3
bg-white
">

<option value="">
Semua Masjid
</option>

</select>

</div>


<div class="
flex
gap-2
flex-wrap
">

<button
onclick="renderPoster()"
class="
bg-[#14532D]
text-white
px-5
py-3
rounded-xl
font-semibold
">

</button>

<button
onclick="downloadPoster()"
class="
bg-slate-800
text-white
px-5
py-3
rounded-xl

">

⬇️ Download PNG

</button>

<button
onclick="sharePoster()"
class="
bg-green-600
text-white
px-5
py-3
rounded-xl
font-semibold
">

📤 Bagikan

</button>

</div>

</div>


<!-- =====================================================
STATUS
===================================================== -->

<div
id="status"
class="
hidden
bg-white
rounded-xl
p-4
mb-5
shadow
text-sm
">

</div>


<!-- =====================================================
PREVIEW
===================================================== -->

<div class="
bg-slate-200
rounded-2xl
p-4
">

<h2 class="
font-bold
mb-3
">

👁️ Preview Poster

</h2>

<div class="poster-wrapper">

<div
id="poster"
class="poster mx-auto shadow-2xl">

</div>

</div>

</div>

</main>


<!-- =====================================================
LIBRARY HTML2CANVAS
===================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
</script>


<script>

/* =====================================================
API
===================================================== */

/*
GANTI DENGAN API_URL YANG SAMA DENGAN home-v2.html
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec";


/* =====================================================
GLOBAL DATA
===================================================== */

let homeData = null;

let semuaKajian = [];

let semuaMasjid = [];

let currentWeekStart = null;


/* =====================================================
UTILITY
===================================================== */

function showStatus(
  text,
  type = "normal"
){

const el =
document.getElementById(
"status"
);

el.classList.remove(
"hidden"
);

el.textContent = text;

if(type === "error"){

el.className =
"bg-red-50 text-red-700 rounded-xl p-4 mb-5 shadow text-sm";

}
else if(type === "success"){

el.className =
"bg-green-50 text-green-700 rounded-xl p-4 mb-5 shadow text-sm";

}
else{

el.className =
"bg-white rounded-xl p-4 mb-5 shadow text-sm";

}

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
FORMAT TANGGAL
===================================================== */

function formatTanggal(
date
){

return date.toLocaleDateString(
"id-ID",
{
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* =====================================================
NAMA HARI
===================================================== */

const namaHari = [
"Minggu",
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu"
];


/* =====================================================
MENCARI SENIN MINGGU BERJALAN
===================================================== */

function getMonday(
date = new Date()
){

const d =
new Date(date);

const day =
d.getDay();

const diff =
day === 0
? -6
: 1 - day;

d.setDate(
d.getDate() + diff
);

d.setHours(
0,0,0,0
);

return d;

}


/* =====================================================
MEMBUAT DAFTAR MINGGU
===================================================== */

function populateWeeks(){

const select =
document.getElementById(
"weekSelect"
);

select.innerHTML = "";

const sekarang =
getMonday();

for(
let i = -4;
i <= 8;
i++
){

const start =
new Date(sekarang);

start.setDate(
start.getDate() +
(i * 7)
);

const end =
new Date(start);

end.setDate(
end.getDate() + 6
);

const option =
document.createElement(
"option"
);

option.value =
start.toISOString();

option.textContent =
`${formatTanggal(start)} – ${formatTanggal(end)}`;

if(i === 0){

option.selected = true;

}

select.appendChild(
option
);

}

currentWeekStart =
sekarang;

}


/* =====================================================
AREA
===================================================== */

function populateAreas(){

const select =
document.getElementById(
"areaSelect"
);

select.innerHTML = `
<option value="">
Semua Area
</option>
`;

const areas =
[
...new Set(
semuaKajian
.map(
j => j.kecamatan
)
.filter(
k => k &&
String(k).trim()
)
)
]
.sort(
(a,b) =>
String(a).localeCompare(
String(b)
)
);

areas.forEach(
area => {

const option =
document.createElement(
"option"
);

option.value =
area;

option.textContent =
area;

select.appendChild(
option
);

});

}


/* =====================================================
MASJID
===================================================== */

function populateMasjid(){

const select =
document.getElementById(
"masjidSelect"
);

select.innerHTML = `
<option value="">
Semua Masjid
</option>
`;

const area =
document.getElementById(
"areaSelect"
).value;


/*
Ambil daftar masjid langsung
dari data jadwal.
*/

let data =
semuaKajian;


/*
Filter berdasarkan area
jika dipilih.
*/

if(area){

data =
data.filter(
j =>
String(j.kecamatan) ===
String(area)
);

}


/*
Buat daftar unik berdasarkan masjidId.
*/

const masjidMap = new Map();

data.forEach(
j => {

const id =
j.masjidId;

if(
id === undefined ||
id === null
){

return;

}

if(
!masjidMap.has(
String(id)
)
){

masjidMap.set(
String(id),
{
id:id,
nama:
j.namaMasjid ||
j.lokasi ||
"Masjid",
kecamatan:
j.kecamatan ||
""
}
);

}

});


/*
Urutkan nama masjid.
*/

const daftarMasjid =
[
...masjidMap.values()
]
.sort(
(a,b) =>
String(a.nama)
.localeCompare(
String(b.nama)
)
);


/*
Masukkan ke SELECT.
*/

daftarMasjid.forEach(
m => {

const option =
document.createElement(
"option"
);

option.value =
m.id;

option.textContent =
m.nama;

select.appendChild(
option
);

});

}





/* =====================================================
WAKTU SORTING
===================================================== */

function timeToNumber(
waktu
){

if(!waktu){

return 9999;

}

const match =
String(waktu)
.match(
/(\d{1,2})[.:](\d{2})/
);

if(!match){

return 9999;

}

return (
Number(match[1]) * 60 +
Number(match[2])
);

}


/* =====================================================
NORMALISASI HARI
===================================================== */

function normalHari(
hari
){

if(!hari){

return "";

}

const h =
String(hari)
.trim()
.toLowerCase();

if(h === "ahad"){

return "Minggu";

}

return (
h.charAt(0).toUpperCase() +
h.slice(1)
);

}


/* =====================================================
MEMBUAT BADGE
===================================================== */

function renderBadges(
j
){

let html = "";

if(
j.isKitab === true ||
j.isKitab === "TRUE"
){

html += `
<span class="
badge
badge-kitab
">
📖 KITAB
</span>
`;

}

if(
j.isMuslimah === true ||
j.isMuslimah === "TRUE"
){

html += `
<span class="
badge
badge-muslimah
">
🌹 MUSLIMAH
</span>
`;

}

if(
j.isAnak === true ||
j.isAnak === "TRUE"
){

html += `
<span class="
badge
badge-anak
">
👶 ANAK
</span>
`;

}

if(j.pekan){

html += `
<span class="
badge
badge-pekan
">
Pekan ${escapeHtml(j.pekan)}
</span>
`;

}

return html;

}


/* =====================================================
MEMBUAT CARD KAJIAN
===================================================== */

function renderKajianCard(
j
){

const namaMasjid =
j.namaMasjid ||
j.lokasi ||
"Masjid";

const area =
j.kecamatan ||
"";

return `

<div class="kajian-card">

<div class="
flex
items-start
gap-4
">

<div class="
text-2xl
font-bold
text-[#14532D]
min-w-[90px]
">

${escapeHtml(
j.waktu || "-"
)}

</div>

<div class="flex-1">

<div class="
font-bold
text-lg
text-[#14532D]
">

${escapeHtml(
namaMasjid
)}

</div>

<div class="
text-sm
text-slate-500
mt-1
">

📍 ${escapeHtml(area)}

</div>

<div class="
font-semibold
mt-3
">

🎙️ ${escapeHtml(
j.pemateri || "-"
)}

</div>

<div class="
text-sm
text-slate-600
mt-1
">

📚 ${escapeHtml(
j.materi || "-"
)}

</div>

<div class="mt-2">

${renderBadges(j)}

</div>

</div>

</div>

</div>

`;

}


/* =====================================================
MENGAMBIL DATA MINGGU
===================================================== */

function getKajianMinggu(){

const value =
document.getElementById(
"weekSelect"
).value;

const start =
new Date(value);

start.setHours(
0,0,0,0
);

const end =
new Date(start);

end.setDate(
end.getDate() + 6
);

return {
start,
end
};

}


/* =====================================================
FILTER DATA
===================================================== */

function getFilteredKajian(){

let data =
[...semuaKajian];

const area =
document.getElementById(
"areaSelect"
).value;

const masjidId =
document.getElementById(
"masjidSelect"
).value;

if(area){

data =
data.filter(
j =>
String(j.kecamatan) ===
String(area)
);

}

if(masjidId){

data =
data.filter(
j =>
String(j.masjidId) ===
String(masjidId)
);

}

return data;

}


/* =====================================================
RENDER POSTER
===================================================== */

function renderPoster(){

const poster =
document.getElementById(
"poster"
);

poster.innerHTML = "";

const {
start,
end
} =
getKajianMinggu();

let data =
getFilteredKajian();

const grouped = {};

namaHari.forEach(
hari => {

grouped[hari] = [];

});


/*
PENTING:

Data jadwal Anda tidak memiliki
tanggal kalender.

Karena itu V1 mengelompokkan
berdasarkan hari.

Kolom "pekan" hanya menjadi badge.
*/

data.forEach(
j => {

const hari =
normalHari(
j.hari
);

if(
grouped[hari]
){

grouped[hari].push(j);

}

});


namaHari
.filter(
hari =>
hari !== "Minggu"
)
.concat(["Minggu"])
.forEach(
hari => {

const list =
grouped[hari];

if(
!list ||
list.length === 0
){

return;

}

list.sort(
(a,b) =>
timeToNumber(a.waktu) -
timeToNumber(b.waktu)
);

poster.innerHTML += `

<section class="mb-8">

<div class="
day-title
rounded-xl
px-5
py-3
text-xl
font-bold
mb-3
">

${hari.toUpperCase()}

</div>

<div class="space-y-3">

${list
.map(
j =>
renderKajianCard(j)
)
.join("")
}

</div>

</section>

`;

});


/* =====================================================
HEADER
===================================================== */

poster.innerHTML = `

<div class="
poster-header
px-10
py-8
mb-8
">

<div class="
text-4xl
font-extrabold
tracking-wide
">

JADWAL KAJIAN

</div>

<div class="
text-2xl
font-semibold
mt-1
">

ISLAM ILMIAH

</div>

<div class="
text-xl
mt-1
text-white/90
">

KOTA CILEGON

</div>

<div class="
mt-5
text-lg
font-semibold
">

${formatTanggal(start)}
–

${formatTanggal(end)}

</div>

</div>

<div class="px-8 pb-10">

${poster.innerHTML}

</div>

<div class="
text-center
text-sm
text-slate-400
pb-6
">

Jadwal Kajian Islam Ilmiah Kota Cilegon

</div>

`;


/* =====================================================
STATUS
===================================================== */

showStatus(
`Menampilkan ${data.length} kajian.`,
"success"
);

}


/* =====================================================
DOWNLOAD PNG
===================================================== */

async function downloadPoster(){

const poster =
document.getElementById(
"poster"
);

if(!poster){

return;

}

showStatus(
"Sedang membuat PNG..."
);

try{

const canvas =
await html2canvas(
poster,
{
scale:2,
useCORS:true,
backgroundColor:"#ffffff"
}
);

const link =
document.createElement(
"a"
);

link.download =
"jadwal-kajian-cilegon.png";

link.href =
canvas.toDataURL(
"image/png"
);

link.click();

showStatus(
"Poster berhasil dibuat.",
"success"
);

}catch(err){

console.error(err);

showStatus(
"Gagal membuat PNG.",
"error"
);

}

}


/* =====================================================
SHARE
===================================================== */

async function sharePoster(){

const poster =
document.getElementById(
"poster"
);

try{

const canvas =
await html2canvas(
poster,
{
scale:2,
useCORS:true,
backgroundColor:"#ffffff"
}
);

canvas.toBlob(
async blob => {

if(!blob){

return;

}

const file =
new File(
[blob],
"jadwal-kajian-cilegon.png",
{
type:"image/png"
}
);

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

title:
"Jadwal Kajian Cilegon",

text:
"Jadwal Kajian Islam Ilmiah Kota Cilegon",

files:[file]

});

}
else{

downloadPoster();

}

},
"image/png"
);

}catch(err){

console.error(err);

showStatus(
"Gagal membagikan poster.",
"error"
);

}

}


/* =====================================================
LOAD DATA
===================================================== */

async function loadData(){

showStatus(
"Memuat data dari database..."
);

try{

const res =
await fetch(
API_URL
);

if(!res.ok){

throw new Error(
"HTTP " + res.status
);

}

homeData =
await res.json();

console.log(
"Data API:",
homeData
);


/* =========================================
AMBIL DATA
========================================= */

semuaKajian =
Array.isArray(
homeData.jadwal
)
? homeData.jadwal
: [];


semuaMasjid = [];


/*
Beberapa versi API mungkin memakai
rankingMasjid.

Tidak masalah karena kita memakai
homeData.masjid sebagai sumber utama.
*/


populateWeeks();

populateAreas();

populateMasjid();

renderPoster();


showStatus(
`Data berhasil dimuat: ${semuaKajian.length} kajian dari ${semuaMasjid.length} masjid.`,
"success"
);


}catch(err){

console.error(
"Gagal memuat data:",
err
);

showStatus(
"Gagal memuat data Live Database.",
"error"
);

}

}


/* =====================================================
EVENT FILTER
===================================================== */

document
.getElementById(
"areaSelect"
)
.addEventListener(
"change",
() => {

populateMasjid();

renderPoster();

});


document
.getElementById(
"masjidSelect"
)
.addEventListener(
"change",
renderPoster
);


document
.getElementById(
"weekSelect"
)
.addEventListener(
"change",
renderPoster
);


/* =====================================================
START
===================================================== */

loadData();

</script>

</body>
</html>
