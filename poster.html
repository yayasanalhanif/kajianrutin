<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec";


/* =====================================================
   GLOBAL
===================================================== */

let homeData = null;

let semuaKajian = [];

let semuaMasjid = [];


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  text,
  type = "normal"
){

  const el =
    document.getElementById(
      "status"
    );

  if(!el){
    return;
  }

  el.classList.remove(
    "hidden"
  );


  if(type === "error"){

    el.className =
      "bg-red-50 text-red-700 rounded-xl p-4 mb-5 shadow text-sm";

  }

  else if(type === "success"){

    el.className =
      "bg-green-50 text-green-700 rounded-xl p-4 mb-5 shadow text-sm";

  }

  else{

    el.className =
      "bg-white rounded-xl p-4 mb-5 shadow text-sm";

  }


  el.textContent =
    text;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
  date
){

  return date.toLocaleDateString(
    "id-ID",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


/* =====================================================
   SENIN MINGGU BERJALAN
===================================================== */

function getMonday(
  date = new Date()
){

  const d =
    new Date(date);

  const day =
    d.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(
    d.getDate() + diff
  );

  d.setHours(
    0,
    0,
    0,
    0
  );

  return d;

}


/* =====================================================
   DAFTAR MINGGU
===================================================== */

function populateWeeks(){

  const select =
    document.getElementById(
      "weekSelect"
    );

  if(!select){
    return;
  }

  select.innerHTML = "";


  const sekarang =
    getMonday();


  for(
    let i = -4;
    i <= 8;
    i++
  ){

    const start =
      new Date(
        sekarang
      );

    start.setDate(
      start.getDate()
      +
      (i * 7)
    );


    const end =
      new Date(
        start
      );

    end.setDate(
      end.getDate() + 6
    );


    const option =
      document.createElement(
        "option"
      );


    /*
     * Jangan gunakan toISOString()
     * sebagai sumber tanggal karena
     * timezone dapat menggeser tanggal.
     *
     * Gunakan tanggal lokal.
     */

    option.value =
      [
        start.getFullYear(),
        String(
          start.getMonth() + 1
        ).padStart(2,"0"),
        String(
          start.getDate()
        ).padStart(2,"0")
      ].join("-");


    option.textContent =
      `${formatTanggal(start)} – ${formatTanggal(end)}`;


    if(i === 0){

      option.selected =
        true;

    }


    select.appendChild(
      option
    );

  }

}


/* =====================================================
   MENGAMBIL MINGGU YANG DIPILIH
===================================================== */

function getKajianMinggu(){

  const select =
    document.getElementById(
      "weekSelect"
    );


  if(
    !select ||
    !select.value
  ){

    const start =
      getMonday();

    const end =
      new Date(start);

    end.setDate(
      end.getDate() + 6
    );

    return {
      start,
      end
    };

  }


  /*
   * Nilai select adalah:
   *
   * YYYY-MM-DD
   *
   * Buat tanggal secara lokal,
   * bukan new Date("YYYY-MM-DD")
   * agar tidak terkena pergeseran UTC.
   */

  const parts =
    select.value.split("-");


  const start =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );


  start.setHours(
    0,
    0,
    0,
    0
  );


  const end =
    new Date(
      start
    );


  end.setDate(
    end.getDate() + 6
  );


  end.setHours(
    23,
    59,
    59,
    999
  );


  return {
    start,
    end
  };

}


/* =====================================================
   NORMALISASI HARI
===================================================== */

function normalHari(
  hari
){

  if(!hari){
    return "";
  }


  const h =
    String(hari)
    .trim()
    .toLowerCase();


  if(
    h === "ahad" ||
    h === "minggu"
  ){

    return "Minggu";

  }


  return (
    h.charAt(0).toUpperCase()
    +
    h.slice(1)
  );

}


/* =====================================================
   NORMALISASI NILAI
===================================================== */

function normalizeValue(
  value
){

  return String(
    value ?? ""
  )
  .trim()
  .toLowerCase();

}


/* =====================================================
   AREA
===================================================== */

function populateAreas(){

  const select =
    document.getElementById(
      "areaSelect"
    );

  if(!select){
    return;
  }


  select.innerHTML = `

    <option value="">
      Semua Area
    </option>

  `;


  const areas =
    [
      ...new Set(

        semuaKajian
          .map(
            j =>
              String(
                j.kecamatan ?? ""
              ).trim()
          )
          .filter(
            x => x !== ""
          )

      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(
          b,
          "id"
        )
    );


  areas.forEach(
    area => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        area;

      option.textContent =
        area;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   MASJID
===================================================== */

function populateMasjid(){

  const select =
    document.getElementById(
      "masjidSelect"
    );

  if(!select){
    return;
  }


  const areaSelect =
    document.getElementById(
      "areaSelect"
    );


  const area =
    areaSelect
      ? normalizeValue(
          areaSelect.value
        )
      : "";


  /*
   * Simpan pilihan masjid lama.
   * Kalau masih tersedia setelah
   * area berubah, kita pertahankan.
   */

  const oldValue =
    select.value;


  select.innerHTML = `

    <option value="">
      Semua Masjid
    </option>

  `;


  const map =
    new Map();


  semuaKajian.forEach(
    j => {

      const id =
        j.masjidId;


      if(
        id === undefined ||
        id === null ||
        String(id).trim() === ""
      ){

        return;

      }


      const kecamatan =
        normalizeValue(
          j.kecamatan
        );


      if(
        area &&
        kecamatan !== area
      ){

        return;

      }


      const key =
        String(id);


      if(
        !map.has(key)
      ){

        map.set(
          key,
          {
            id:id,

            nama:
              j.namaMasjid ||
              j.lokasi ||
              "Masjid"
          }
        );

      }

    }
  );


  const daftar =
    [
      ...map.values()
    ]
    .sort(
      (a,b) =>
        String(a.nama)
        .localeCompare(
          String(b.nama),
          "id"
        )
    );


  daftar.forEach(
    m => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        String(m.id);


      option.textContent =
        m.nama;


      select.appendChild(
        option
      );

    }
  );


  /*
   * Pertahankan pilihan lama
   * jika masih tersedia.
   */

  if(
    oldValue &&
    [
      ...select.options
    ].some(
      o =>
        o.value ===
        String(oldValue)
    )
  ){

    select.value =
      String(oldValue);

  }

}


/* =====================================================
   FILTER DATA
===================================================== */

function getFilteredKajian(){

  /*
   * Minggu TIDAK digunakan
   * untuk memfilter data.
   *
   * Karena jadwal JKC adalah
   * jadwal rutin mingguan.
   *
   * Minggu hanya menentukan
   * tanggal Senin-Ahad pada
   * header poster.
   */

  let data =
    [
      ...semuaKajian
    ];


  const areaSelect =
    document.getElementById(

   */

          ).trim()

          masjidId

      );

  }


  return data;

}


/* =====================================================
   SORTING WAKTU
===================================================== */

function timeToNumber(
  waktu
){

  if(!waktu){

    return 9999;

  }


  const text =
    String(
      waktu
    ).trim();


  const match =
    text.match(
      /(\d{1,2})[.:](\d{2})/
    );


  if(!match){

    return 9999;

  }


  return (
    Number(match[1]) * 60
    +
    Number(match[2])
  );

}

/* =====================================================
   GROUP HARI
===================================================== */

function buatHariGroups(
  data
){

  const urutan = [

    "Senin",
    "Selasa",
    "Rabu",
    "Kamis",
    "Jumat",
    "Sabtu",
    "Minggu"

  ];


  const grouped = {};


  urutan.forEach(
    hari => {

      grouped[hari] = [];

    }
  );


  data.forEach(
    j => {

      const hari =
        normalHari(
          j.hari
        );


      if(
        grouped[hari]
      ){

        grouped[hari].push(
          j
        );

      }

    }
  );


  urutan.forEach(
    hari => {

      grouped[hari].sort(
        (a,b) =>

          timeToNumber(
            a.waktu
          )
          -
          timeToNumber(
            b.waktu
          )

      );

    }
  );


  return urutan
    .filter(
      hari =>
        grouped[hari].length
        > 0
    )
    .map(
      hari => ({

        hari,

        list:
          grouped[hari]

      })
    );

}


/* =====================================================
   BAGI HARI MENJADI 2 KOLOM
===================================================== */

function bagiHariMenjadiDuaKolom(
  hariGroups
){

  if(
    !hariGroups.length
  ){

    return {

      kiri:[],
      kanan:[]

    };

  }


  if(
    hariGroups.length === 1
  ){

    return {

      kiri:
        hariGroups,

      kanan:[]

    };

  }


  let terbaik =
    null;


  /*
   * Hari harus tetap berurutan.
   *
   * Kita hanya memilih titik
   * pemisah antar hari.
   */

  for(
    let i = 1;
    i < hariGroups.length;
    i++
  ){

    const kiri =
      hariGroups.slice(
        0,
        i
      );


    const kanan =
      hariGroups.slice(
        i
      );


    const jumlahKiri =
      kiri.reduce(
        (
          total,
          group
        ) =>
          total +
          group.list.length,
        0
      );


    const jumlahKanan =
      kanan.reduce(
        (
          total,
          group
        ) =>
          total +
          group.list.length,
        0
      );


    const selisih =
      Math.abs(
        jumlahKiri -
        jumlahKanan
      );


    if(
      terbaik === null ||
      selisih <
      terbaik.selisih
    ){

      terbaik = {

        kiri,
        kanan,

        jumlahKiri,
        jumlahKanan,

        selisih

      };

    }

  }


  return {

    kiri:
      terbaik.kiri,

    kanan:
      terbaik.kanan

  };

}

/* =====================================================
   BALANCE 2 KOLOM
===================================================== */

function balancePosterColumns(){

  const poster =
    document.getElementById(
      "poster"
    );


  if(!poster){

    return;

  }


  const columns =
    poster.querySelectorAll(
      ".poster-column"
    );


  if(
    columns.length !== 2
  ){

    return;

  }


  const kiri =
    columns[0];


  const kanan =
    columns[1];


  /*
   * Reset tinggi sebelumnya.
   */

  [
    kiri,
    kanan
  ].forEach(
    column => {

      column.style.minHeight =
        "";

    }
  );


  void poster.offsetHeight;


  const tinggiKiri =
    kiri.getBoundingClientRect()
      .height;


  const tinggiKanan =
    kanan.getBoundingClientRect()
      .height;


  const target =
    Math.max(
      tinggiKiri,
      tinggiKanan
    );


  /*
   * Jangan melakukan apa-apa
   * jika sudah seimbang.
   */

  if(
    Math.abs(
      tinggiKiri -
      tinggiKanan
    ) < 2
  ){

    return;

  }


  /*
   * Kolom pendek.
   */

  const pendek =
    tinggiKiri <
    tinggiKanan
      ? kiri
      : kanan;


  const tinggiPendek =
    Math.min(
      tinggiKiri,
      tinggiKanan
    );


  const tambahan =
    target -
    tinggiPendek;


  /*
   * Ambil semua BLOK HARI
   * pada kolom pendek.
   */

  const blocks =
    [
      ...pendek.querySelectorAll(
        ".poster-day-section"
      )
    ];


  if(
    !blocks.length
  ){

    pendek.style.minHeight =
      `${target}px`;

    return;

  }


  /*
   * Stretch dibagi merata
   * ke seluruh blok hari.
   */

  const tambahanPerBlock =
    tambahan /
    blocks.length;


  blocks.forEach(
    block => {

      const h =
        block.getBoundingClientRect()
          .height;


      block.style.minHeight =
        `${h + tambahanPerBlock}px`;

    }
  );

}


/* =====================================================
   DOWNLOAD PNG
===================================================== */

async function downloadPoster(){

  const poster =
    document.getElementById(
      "poster"
    );


  if(!poster){

    return;

  }


  showStatus(
    "Sedang membuat PNG..."
  );


  try{

    /*
     * Pastikan balancing selesai
     * sebelum screenshot.
     */

    balancePosterColumns();


    await new Promise(
      resolve =>
        requestAnimationFrame(
          resolve
        )
    );


    const canvas =
      await html2canvas(
        poster,
        {
          scale:2,

          useCORS:true,

          backgroundColor:
            "#ffffff"
        }
      );


    const link =
      document.createElement(
        "a"
      );


    link.download =
      "jadwal-kajian-cilegon.png";


    link.href =
      canvas.toDataURL(
        "image/png"
      );


    link.click();


    showStatus(
      "Poster berhasil dibuat.",
      "success"
    );


  }catch(err){

    console.error(
      "Download poster:",
      err
    );


    showStatus(
      "Gagal membuat PNG.",
      "error"
    );

  }

}


/* =====================================================
   SHARE POSTER
===================================================== */

async function sharePoster(){

  const poster =
    document.getElementById(
      "poster"
    );


  if(!poster){

    return;

  }


  try{

    balancePosterColumns();


    await new Promise(
      resolve =>
        requestAnimationFrame(
          resolve
        )
    );


    const canvas =
      await html2canvas(
        poster,
        {
          scale:2,

          useCORS:true,

          backgroundColor:
            "#ffffff"
        }
      );


    canvas.toBlob(
      async blob => {

        if(!blob){

          showStatus(
            "Gagal membuat gambar.",
            "error"
          );

          return;

        }


        const file =
          new File(
            [
              blob
            ],
            "jadwal-kajian-cilegon.png",
            {
              type:
                "image/png"
            }
          );


        if(
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files:[
              file
            ]
          })
        ){

          await navigator.share({

            title:
              "Jadwal Kajian Cilegon",

            text:
              "Jadwal Kajian Islam Ilmiah Kota Cilegon",

            files:[
              file
            ]

          });

        }

        else{

          downloadPoster();

        }

      },
      "image/png"
    );


  }catch(err){

    console.error(
      "Share poster:",
      err
    );


    showStatus(
      "Gagal membagikan poster.",
      "error"
    );

  }

}
