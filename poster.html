<script>

/* =====================================================
API
===================================================== */

/*
GANTI DENGAN API_URL YANG SAMA DENGAN home-v2.html
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbyYS2hsQhEfsJHc882_sYPJBfdLnYVr1e7wu1XpSelEdVqVhe_SiGBB-_zcaTPhb3QEwA/exec";


/* =====================================================
GLOBAL DATA
===================================================== */

let homeData = null;

let semuaKajian = [];

let semuaMasjid = [];

let currentWeekStart = null;


/* =====================================================
UTILITY
===================================================== */

function showStatus(
  text,
  type = "normal"
){

const el =
document.getElementById(
"status"
);

el.classList.remove(
"hidden"
);

el.textContent = text;

if(type === "error"){

el.className =
"bg-red-50 text-red-700 rounded-xl p-4 mb-5 shadow text-sm";

}
else if(type === "success"){

el.className =
"bg-green-50 text-green-700 rounded-xl p-4 mb-5 shadow text-sm";

}
else{

el.className =
"bg-white rounded-xl p-4 mb-5 shadow text-sm";

}

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
FORMAT TANGGAL
===================================================== */

function formatTanggal(
date
){

return date.toLocaleDateString(
"id-ID",
{
day:"numeric",
month:"long",
year:"numeric"
}
);

}


/* =====================================================
NAMA HARI
===================================================== */

const namaHari = [
"Minggu",
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu"
];


/* =====================================================
MENCARI SENIN MINGGU BERJALAN
===================================================== */

function getMonday(
date = new Date()
){

const d =
new Date(date);

const day =
d.getDay();

const diff =
day === 0
? -6
: 1 - day;

d.setDate(
d.getDate() + diff
);

d.setHours(
0,0,0,0
);

return d;

}


/* =====================================================
MEMBUAT DAFTAR MINGGU
===================================================== */

function populateWeeks(){

const select =
document.getElementById(
"weekSelect"
);

select.innerHTML = "";

const sekarang =
getMonday();

for(
let i = -4;
i <= 8;
i++
){

const start =
new Date(sekarang);

start.setDate(
start.getDate() +
(i * 7)
);

const end =
new Date(start);

end.setDate(
end.getDate() + 6
);

const option =
document.createElement(
"option"
);

option.value =
start.toISOString();

option.textContent =
`${formatTanggal(start)} – ${formatTanggal(end)}`;

if(i === 0){

option.selected = true;

}

select.appendChild(
option
);

}

currentWeekStart =
sekarang;

}


/* =====================================================
AREA
===================================================== */

function populateAreas(){

const select =
document.getElementById(
"areaSelect"
);

select.innerHTML = `
<option value="">
Semua Area
</option>
`;

const areas =
[
...new Set(
semuaKajian
.map(
j => j.kecamatan
)
.filter(
k => k &&
String(k).trim()
)
)
]
.sort(
(a,b) =>
String(a).localeCompare(
String(b)
)
);

areas.forEach(
area => {

const option =
document.createElement(
"option"
);

option.value =
area;

option.textContent =
area;

select.appendChild(
option
);

});

}


/* =====================================================
MASJID
===================================================== */

function populateMasjid(){

const select =
document.getElementById(
"masjidSelect"
);

select.innerHTML = `
<option value="">
Semua Masjid
</option>
`;

const area =
document.getElementById(
"areaSelect"
).value;


/*
Ambil daftar masjid langsung
dari data jadwal.
*/

let data =
semuaKajian;


/*
Filter berdasarkan area
jika dipilih.
*/

if(area){

data =
data.filter(
j =>
String(j.kecamatan) ===
String(area)
);

}


/*
Buat daftar unik berdasarkan masjidId.
*/

const masjidMap = new Map();

data.forEach(
j => {

const id =
j.masjidId;

if(
id === undefined ||
id === null
){

return;

}

if(
!masjidMap.has(
String(id)
)
){

masjidMap.set(
String(id),
{
id:id,
nama:
j.namaMasjid ||
j.lokasi ||
"Masjid",
kecamatan:
j.kecamatan ||
""
}
);

}

});


/*
Urutkan nama masjid.
*/

const daftarMasjid =
[
...masjidMap.values()
]
.sort(
(a,b) =>
String(a.nama)
.localeCompare(
String(b.nama)
)
);


/*
Masukkan ke SELECT.
*/

daftarMasjid.forEach(
m => {

const option =
document.createElement(
"option"
);

option.value =
m.id;

option.textContent =
m.nama;

select.appendChild(
option
);

});

}





/* =====================================================
WAKTU SORTING
===================================================== */

function timeToNumber(
waktu
){

if(!waktu){

return 9999;

}

const match =
String(waktu)
.match(
/(\d{1,2})[.:](\d{2})/
);

if(!match){

return 9999;

}

return (
Number(match[1]) * 60 +
Number(match[2])
);

}


/* =====================================================
NORMALISASI HARI
===================================================== */

function normalHari(
hari
){

if(!hari){

return "";

}

const h =
String(hari)
.trim()
.toLowerCase();

if(h === "ahad"){

return "Minggu";

}

return (
h.charAt(0).toUpperCase() +
h.slice(1)
);

}


/* =====================================================
MEMBUAT BADGE
===================================================== */

function renderBadges(
j
){

let html = "";

if(
j.isKitab === true ||
j.isKitab === "TRUE"
){

html += `
<span class="
badge
badge-kitab
">
📖 KITAB
</span>
`;

}

if(
j.isMuslimah === true ||
j.isMuslimah === "TRUE"
){

html += `
<span class="
badge
badge-muslimah
">
🌹 MUSLIMAH
</span>
`;

}

if(
j.isAnak === true ||
j.isAnak === "TRUE"
){

html += `
<span class="
badge
badge-anak
">
👶 ANAK
</span>
`;

}

if(j.pekan){

html += `
<span class="
badge
badge-pekan
">
Pekan ${escapeHtml(j.pekan)}
</span>
`;

}

return html;

}


/* =====================================================
MEMBUAT CARD KAJIAN
===================================================== */

  function renderKajianCard(j){

  let badges = "";

  const isKitab =
    j.isKitab === true ||
    j.isKitab === "TRUE";

  const isMuslimah =
    j.isMuslimah === true ||
    j.isMuslimah === "TRUE";

  const isAnak =
    j.isAnak === true ||
    j.isAnak === "TRUE";


  if(isKitab){

    badges += `
      <span class="
        poster-card-badge
        poster-card-kitab
      ">
        📖 KITAB
      </span>
    `;

  }


  if(isMuslimah){

    badges += `
      <span class="
        poster-card-badge
        poster-card-muslimah
      ">
        🌸 MUSLIMAH
      </span>
    `;

  }


  if(isAnak){

    badges += `
      <span class="
        poster-card-badge
        poster-card-anak
      ">
        👶 ANAK
      </span>
    `;

  }


  if(j.pekan){

    badges += `
      <span class="
        poster-card-badge
        poster-card-pekan
      ">
        📅 PEKAN ${escapeHtml(
          String(j.pekan)
        )}
      </span>
    `;

  }


  /*
    Waktu dibuat lebih aman.

    Jika panjang teks lebih dari 8 karakter,
    beri class long agar ukuran font mengecil.
  */

  const waktu =
    String(
      j.waktu || "--:--"
    ).trim();

  const waktuClass =
    waktu.length > 8
      ? "long"
      : "";


  return `

    <div class="poster-kajian">

      <div class="
        poster-time
        ${waktuClass}
      ">

        ${escapeHtml(waktu)}

      </div>


      <div class="poster-kajian-body">


        <div class="poster-pemateri">

          ${escapeHtml(
            j.pemateri || "-"
          )}

        </div>


        <div class="poster-materi">

          ${escapeHtml(
            j.materi || "-"
          )}

        </div>


        <div class="poster-card-badges">

          ${badges}

        </div>


      </div>

    </div>

  `;

}


/* =====================================================
MENGAMBIL DATA MINGGU
===================================================== */

function getKajianMinggu(){

const value =
document.getElementById(
"weekSelect"
).value;

const start =
new Date(value);

start.setHours(
0,0,0,0
);

const end =
new Date(start);

end.setDate(
end.getDate() + 6
);

return {
start,
end
};

}


/* =====================================================
FILTER DATA
===================================================== */

function getFilteredKajian(){

let data =

  function bagiHariMenjadiDuaKolom(hariGroups) {

  if (!hariGroups || hariGroups.length <= 1) {

    return {
      kiri: hariGroups || [],
      kanan: []
    };

  }

  const totalKajian =
    hariGroups.reduce(
      (total, hari) =>
        total + hari.list.length,
      0
    );

  let terbaik = null;

  /*
   * Karena jumlah hari biasanya hanya 7,
   * kita bisa mencoba semua kemungkinan
   * titik pemisah.
   *
   * Yang dicari:
   * - seluruh blok hari tetap utuh
   * - urutan hari tetap terjaga
   * - selisih jumlah kajian sekecil mungkin
   */

  for (
    let i = 1;
    i < hariGroups.length;
    i++
  ) {

    const kiri =
      hariGroups.slice(0, i);

    const kanan =
      hariGroups.slice(i);

    const jumlahKiri =
      kiri.reduce(
        (total, hari) =>
          total + hari.list.length,
        0
      );

    const jumlahKanan =
      kanan.reduce(
        (total, hari) =>
          total + hari.list.length,
        0
      );

    const selisih =
      Math.abs(
        jumlahKiri -
        jumlahKanan
      );

    if (
      terbaik === null ||
      selisih < terbaik.selisih
    ) {

      terbaik = {

        kiri,
        kanan,

        jumlahKiri,
        jumlahKanan,

        selisih

      };

    }

  }

  return {

    kiri: terbaik.kiri,
    kanan: terbaik.kanan

  };

}

function renderPoster(){

  /* =====================================================
     AMBIL DATA SESUAI FILTER
  ===================================================== */

  let data =
    getFilteredKajian();


  /* =====================================================
     NAMA MASJID
  ===================================================== */

  const masjidSelect =
    document.getElementById(
      "masjidSelect"
    );

  let namaMasjid =
    "Semua Masjid";

  if(
    masjidSelect &&
    masjidSelect.value
  ){

    const option =
      masjidSelect.options[
        masjidSelect.selectedIndex
      ];

    namaMasjid =
      option
        ? option.textContent.trim()
        : "Masjid";

  }


  /* =====================================================
     AREA
  ===================================================== */

  let area = "";

  if(data.length){

    area =
      data[0].kecamatan ||
      "";

  }


  /* =====================================================
     GROUP DATA BERDASARKAN HARI
  ===================================================== */

  const grouped = {

    Senin: [],
    Selasa: [],
    Rabu: [],
    Kamis: [],
    Jumat: [],
    Sabtu: [],
    Minggu: []

  };


  data.forEach(j => {

    const hari =
      normalHari(j.hari);

    if(
      grouped[hari]
    ){

      grouped[hari].push(j);

    }

  });


  /* =====================================================
     URUTKAN WAKTU
  ===================================================== */

  Object.keys(
    grouped
  ).forEach(hari => {

    grouped[hari].sort(
      (a,b) => {

        return (
          timeToNumber(a.waktu) -
          timeToNumber(b.waktu)
        );

      }
    );

  });


  /* =====================================================
     BENTUK BLOK HARI
     
     Setiap hari tetap menjadi SATU BLOK.
     Tidak boleh dipecah antara kolom.
  ===================================================== */

  const urutanHari = [

    "Senin",
    "Selasa",
    "Rabu",
    "Kamis",
    "Jumat",
    "Sabtu",
    "Minggu"

  ];


  const hariGroups = [];


  urutanHari.forEach(hari => {

    if(
      grouped[hari] &&
      grouped[hari].length
    ){

      hariGroups.push({

        hari: hari,

        list:
          grouped[hari]

      });

    }

  });


  /* =====================================================
     PEMBAGIAN 2 KOLOM
     
     Kita mencoba seluruh kombinasi blok hari.
     
     Prioritas:
     1. Selisih jumlah kajian terkecil
     2. Perpindahan antar kolom seminimal mungkin
        agar urutan hari tetap natural
     3. Jumlah hari kiri-kanan seimbang
  ===================================================== */

  function bagiHariDuaKolom(
    groups
  ){

    if(
      !groups.length
    ){

      return {
        kiri: [],
        kanan: []
      };

    }


    if(
      groups.length === 1
    ){

      return {
        kiri: groups,
        kanan: []
      };

    }


    const totalKajian =
      groups.reduce(
        (
          total,
          group
        ) => {

          return (
            total +
            group.list.length
          );

        },
        0
      );


    const jumlahHari =
      groups.length;


    let terbaik = null;


    /*
     * Maksimal hanya 7 hari.
     * Jadi seluruh kombinasi sangat ringan.
     */
    const jumlahKombinasi =
      Math.pow(
        2,
        jumlahHari
      );


    for(
      let mask = 1;
      mask <
      jumlahKombinasi - 1;
      mask++
    ){

      const kiri = [];
      const kanan = [];

      let jumlahKiri = 0;
      let jumlahKanan = 0;


      for(
        let i = 0;
        i < jumlahHari;
        i++
      ){

        if(
          mask & (1 << i)
        ){

          kiri.push(
            groups[i]
          );

          jumlahKiri +=
            groups[i].list.length;

        }
        else{

          kanan.push(
            groups[i]
          );

          jumlahKanan +=
            groups[i].list.length;

        }

      }


      const selisih =
        Math.abs(
          jumlahKiri -
          jumlahKanan
        );


      /*
       * Berapa kali perpindahan kolom
       * terjadi sepanjang urutan hari.
       *
       * Semakin kecil semakin natural.
       */
      let perpindahan = 0;


      for(
        let i = 1;
        i < jumlahHari;
        i++
      ){

        const sebelumnya =
          Boolean(
            mask &
            (1 << (i - 1))
          );

        const sekarang =
          Boolean(
            mask &
            (1 << i)
          );

        if(
          sebelumnya !==
          sekarang
        ){

          perpindahan++;

        }

      }


      const selisihJumlahHari =
        Math.abs(
          kiri.length -
          kanan.length
        );


      const kandidat = {

        kiri,
        kanan,

        jumlahKiri,
        jumlahKanan,

        selisih,

        perpindahan,

        selisihJumlahHari

      };


      /*
       * Tentukan kandidat terbaik.
       */
      if(
        terbaik === null
      ){

        terbaik =
          kandidat;

      }
      else if(
        kandidat.selisih <
        terbaik.selisih
      ){

        terbaik =
          kandidat;

      }
      else if(
        kandidat.selisih ===
        terbaik.selisih &&
        kandidat.perpindahan <
        terbaik.perpindahan
      ){

        terbaik =
          kandidat;

      else if(

        kandidat.perpindahan ===
        terbaik.perpindahan &&
        kandidat.selisihJumlahHari <
        terbaik.selisihJumlahHari
      ){

        terbaik =
          kandidat;

      }

    }


    return {

      kiri:
        terbaik.kiri,

      kanan:
        terbaik.kanan

  }


  const kolom =

  /* =====================================================
     BALANCE TINGGI KOLOM
     
     Kolom yang lebih pendek akan menerima
     tambahan tinggi.
     
     Tambahan tinggi dibagi MERATA ke
     seluruh CARD KAJIAN pada kolom tersebut.
  ===================================================== */

  function balancePosterColumns(){

    const columns =
      poster.querySelectorAll(
        ".poster-column"
      );


    if(
      columns.length !== 2
    ){

      return;

    }


    const kiri =
      columns[0];

    const kanan =
      columns[1];


    /*
     * Reset semua ukuran tambahan.
     */

    poster
      .querySelectorAll(
        ".poster-kajian"
      )
      .forEach(card => {

        card.style.minHeight =
          "";

      });


    /*
     * Paksa browser menghitung ulang
     * layout asli.
     */

    void poster.offsetHeight;


    const tinggiKiri =
      kiri.getBoundingClientRect()
        .height;

    const tinggiKanan =
      kanan.getBoundingClientRect()
        .height;


    const selisih =
      Math.abs(
        tinggiKiri -
        tinggiKanan
      );


    /*
     * Sudah hampir sama.
     */

    if(
      selisih < 1
    ){

      return;

    }


    const kolomPendek =
      tinggiKiri <
      tinggiKanan
        ? kiri
        : kanan;


    const kolomPanjang =
      tinggiKiri <
      tinggiKanan
        ? kanan
        : kiri;


    /*
     * Ambil seluruh card kajian
     * pada kolom yang pendek.
     */

    const cards =
      [
        ...kolomPendek.querySelectorAll(
          ".poster-kajian"
        )
      ];


    if(
      !cards.length
    ){

      return;

    }


    /*
     * Tambahan tinggi dibagi rata
     * kepada seluruh card.
     */

    const tambahanPerCard =
      selisih /
      cards.length;


    cards.forEach(card => {

      const tinggiAsli =
        card.getBoundingClientRect()
          .height;


      card.style.minHeight =
        `${tinggiAsli + tambahanPerCard}px`;

    });


    /*
     * Pastikan browser menghitung
     * hasil akhirnya.
     */

    void kolomPanjang.offsetHeight;


  }


  /* =====================================================
     JALANKAN SETELAH LAYOUT SELESAI
  ===================================================== */

  requestAnimationFrame(() => {

    balancePosterColumns();


    /*
     * Satu frame tambahan untuk memastikan
     * layout akhir sudah stabil sebelum
     * html2canvas digunakan.
     */

    requestAnimationFrame(() => {

      balancePosterColumns();

    });

  });


  /* =====================================================
     STATUS
  ===================================================== */

  showStatus(
    `Menampilkan ${data.length} kajian.`,
    "success"
  );

}

async function downloadPoster(){

const poster =
document.getElementById(
"poster"
);

if(!poster){

return;

}

showStatus(
"Sedang membuat PNG..."
);

try{

const canvas =
await html2canvas(
poster,
{
scale:2,
useCORS:true,
backgroundColor:"#ffffff"
}
);

const link =
document.createElement(
"a"
);

link.download =
"jadwal-kajian-cilegon.png";

link.href =
canvas.toDataURL(
"image/png"
);

link.click();

showStatus(
"Poster berhasil dibuat.",
"success"
);

}catch(err){

console.error(err);

showStatus(
"Gagal membuat PNG.",
"error"
);

}

}


/* =====================================================
SHARE
===================================================== */

async function sharePoster(){

const poster =
document.getElementById(
"poster"
);

try{

const canvas =
await html2canvas(
poster,
{
scale:2,
useCORS:true,
backgroundColor:"#ffffff"
}
);

canvas.toBlob(
async blob => {

if(!blob){

return;

}

const file =
new File(
[blob],
"jadwal-kajian-cilegon.png",
{
type:"image/png"
}
);

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

title:
"Jadwal Kajian Cilegon",

text:
"Jadwal Kajian Islam Ilmiah Kota Cilegon",

files:[file]

});

}
else{

downloadPoster();

}

},
"image/png"
);

}catch(err){

console.error(err);

showStatus(
"Gagal membagikan poster.",
"error"
);

}

}
